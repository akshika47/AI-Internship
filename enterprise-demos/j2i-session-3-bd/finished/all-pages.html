solid var(--line)}\n.was{opacity:.78}\n.now{font-weight:600}\n.src{font-size:.8rem;color:var(--muted);white-space:nowrap}\n.strip .src{color:#cfe0d4}\n.quote{border-left:3px solid var(--accent);padding:.15rem 0 .15rem .8rem;margin:.5rem 0}\n.foot{margin-top:28px;font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}\n@media print{body{background:#fff}.card{break-inside:avoid}}\n<\/style>\n<\/head>\n<body>\n<main class=\"page\">\n\n<div class=\"eyebrow\">J2 Intelligence Group \u00b7 AI Opportunity Map \u00b7 <span class=\"tag warn\">Fictional client<\/span> <span class=\"tag warn\">Draft, not reviewed<\/span><\/div>\n<h1>Harborline Systems Group: where AI can give your proposal team its days back<\/h1>\n<p class=\"lede\">Source: discovery call, \"last week\" per the file [VERIFY exact date] (calls/discovery-call.md, a fictional call). Prepared by: J2i call lead [TO CONFIRM]. Date: [VERIFY: due within 24 hours of the call]. Reviewer: [TO CONFIRM: a named person must review before this goes anywhere].<\/p>\n\n<section class=\"strip\">\n  <div class=\"eyebrow\">Situation summary<\/div>\n  <h2>Small proposal team, a big recompete, and a bad experience with AI.<\/h2>\n  <p>Harborline is a service-disabled veteran-owned business of 138 people, mostly IT service desk and field support for the VA. It holds two task orders. The larger one ends in March and is about 40 percent of revenue. One person builds most proposals by hand, the engineers who help are billable, and the firm has been flat for two years. In your words: <em>\"Getting the March recompete right. Everything else is second.\"<\/em><\/p>\n<\/section>\n\n<section class=\"card\" style=\"margin-bottom:22px\">\n  <div class=\"card-head\"><h2>Top 3 AI opportunities<\/h2><span class=\"date\">Ranked by speed to value<\/span><\/div>\n  <table class=\"compare\">\n    <tr><th>#<\/th><th>Use case<\/th><th>Problem, in your words<\/th><th>Estimated impact<\/th><th>Complexity<\/th><\/tr>\n    <tr>\n      <td>1<\/td>\n      <td class=\"now\">Compliance matrix draft from the solicitation, with page references for a person to check<\/td>\n      <td>\"I read the whole thing, usually 80 to 120 pages, and build a compliance matrix in Excel by hand. That alone is two to three days.\"<\/td>\n      <td>Two to three days per proposal today; your target is \"hours instead of days\". Hours after: ESTIMATE NEEDED. Across 12 to 15 proposals that is 24 to 45 days a year at today's pace (our arithmetic from your numbers).<\/td>\n      <td>Low [VERIFY]<\/td>\n    <\/tr>\n    <tr>\n      <td>2<\/td>\n      <td class=\"now\">Past performance finder over Harborline's own files, returning the source write-up and never composing new contract facts<\/td>\n      <td>\"Our best past performance write-ups are scattered across three drives and people's laptops. I rewrite the same company overview every time because I can't find the good version.\"<\/td>\n      <td>\"Easily a day each time, just hunting\", on every proposal. About 12 to 15 days a year at today's pace (our arithmetic). Time after: ESTIMATE NEEDED.<\/td>\n      <td>Medium [VERIFY]: files must be gathered first<\/td>\n    <\/tr>\n    <tr>\n      <td>3<\/td>\n      <td class=\"now\">Structured first drafts for engineers to review, so experts give review time instead of writing time<\/td>\n      <td>\"Every hour they spend on a proposal is an hour off a contract, and they hate it.\"<\/td>\n      <td>Your target: \"one review hour instead of a day of writing\". Engineer hours today: ESTIMATE NEEDED.<\/td>\n      <td>Medium [VERIFY]<\/td>\n    <\/tr>\n  <\/table>\n  <p class=\"src\">Possible upside you raised: about ten more solicitations a year are passed on for lack of hours. How many could be bid: ESTIMATE NEEDED. Win value: ESTIMATE NEEDED.<\/p>\n<\/section>\n\n<div class=\"grid\">\n  <section class=\"card\">\n    <div class=\"card-head\"><h2>Recommended first step<\/h2><span class=\"tag\">One recommendation<\/span><\/div>\n    <p>Start with opportunity 1, the compliance matrix, aimed at the draft solicitation expected in December. It needs only the solicitation itself, so it does not wait on gathering past performance files. Every row can be checked against a page reference, so it fits your rule that nothing invented reaches a contracting officer. Past performance (opportunity 2) follows once the files are in one place.<\/p>\n    <p>Before any contract data is touched, Harborline's IT security lead approves the tool, and it runs on Harborline's own approved environment. Build time and effort: [TO CONFIRM by J2i and the build partner].<\/p>\n  <\/section>\n  <section class=\"card\">\n    <div class=\"card-head\"><h2>Proposed next step<\/h2><span class=\"tag\">Time-bound<\/span><\/div>\n    <p>A 30-minute scoping call with the COO and the Capture and Proposal Lead, with the IT security lead invited for the data and tool questions. Target: before the draft solicitation lands in December. Date: [TO CONFIRM]. A person at J2i sends the invite; this page does not send anything.<\/p>\n    <p>You said you would want to move fast because \"December is close\". Pricing and delivery terms are not in this map: [TO CONFIRM].<\/p>\n  <\/section>\n<\/div>\n\n<h2 style=\"margin:34px 0 12px\">Working notes: what we heard (internal, not part of the client page)<\/h2>\n<div class=\"grid\">\n  <section class=\"card\">\n    <div class=\"card-head\"><h2>Pain points, in their words<\/h2><\/div>\n    <div class=\"quote\">\"Finding things.\" (Capture and Proposal Lead)<\/div>\n    <div class=\"quote\">\"I rewrite the same company overview every time because I can't find the good version.\" (Capture and Proposal Lead)<\/div>\n    <div class=\"quote\">\"Our engineers are billable. Every hour they spend on a proposal is an hour off a contract, and they hate it.\" (COO)<\/div>\n    <div class=\"quote\">\"We pass on more than that because we don't have the hours.\" (Capture and Proposal Lead)<\/div>\n    <div class=\"quote\">\"That's growth we never see. We've been flat for two years.\" (COO)<\/div>\n    <div class=\"quote\">\"We'd be laying people off.\" (COO, if the March recompete goes badly)<\/div>\n  <\/section>\n  <section class=\"card\">\n    <div class=\"card-head\"><h2>Every number<\/h2><\/div>\n    <table class=\"compare\">\n      <tr><th>Figure<\/th><th>Said by<\/th><th>Note<\/th><\/tr>\n      <tr><td>138 people<\/td><td>COO<\/td><td>Corrected our 140<\/td><\/tr>\n      <tr><td>2 task orders<\/td><td>COO<\/td><td>We had said one<\/td><\/tr>\n      <tr><td>Larger one ends March, about 40% of revenue<\/td><td>COO<\/td><td>Recompete expected<\/td><\/tr>\n      <tr><td>Smaller one: option year expected, not confirmed in writing<\/td><td>COO<\/td><td>Open item<\/td><\/tr>\n      <tr><td>80 to 120 pages per solicitation<\/td><td>Capture and Proposal Lead<\/td><td><\/td><\/tr>\n      <tr><td>Compliance matrix: 2 to 3 days<\/td><td>Capture and Proposal Lead<\/td><td>Built by hand in Excel<\/td><\/tr>\n      <tr><td>12 to 15 proposals submitted a year<\/td><td>Capture and Proposal Lead<\/td><td><\/td><\/tr>\n      <tr><td>About 10 more passed on<\/td><td>Capture and Proposal Lead<\/td><td>\"Maybe\"; some with a real shot<\/td><\/tr>\n      <tr><td>About 1 day of hunting per proposal<\/td><td>Capture and Proposal Lead<\/td><td>\"Easily a day\"<\/td><\/tr>\n      <tr><td>Flat for 2 years<\/td><td>COO<\/td><td><\/td><\/tr>\n      <tr><td>Under fifty thousand: COO signs; above: CEO signs<\/td><td>COO<\/td><td>Currency not stated: [VERIFY] USD<\/td><\/tr>\n      <tr><td>Draft solicitation December, final January, due about 30 days later<\/td><td>Capture and Proposal Lead<\/td><td>Expected, not confirmed [VERIFY]<\/td><\/tr>\n      <tr><td>90 days: one thing to fix<\/td><td>Both<\/td><td>The March recompete<\/td><\/tr>\n    <\/table>\n  <\/section>\n  <section class=\"card\">\n    <div class=\"card-head\"><h2>Objections and constraints<\/h2><\/div>\n    <ul>\n      <li><strong>Trust.<\/strong> An AI proposal tool trialled last year \"wrote confident nonsense about our past performance, made up a contract number. After that nobody trusted it.\" The tool is not named: [VERIFY].<\/li>\n      <li><strong>No invented facts.<\/strong> \"I'm not putting something in front of a contracting officer that invents facts.\" (COO)<\/li>\n      <li><strong>Another unused tool.<\/strong> \"Or if we're buying another tool nobody opens.\" (COO)<\/li>\n      <li><strong>Data.<\/strong> \"Some of it is controlled, so it can't go into just any tool.\" (COO)<\/li>\n      <li><strong>Approvals.<\/strong> COO under the spend line, CEO above it, and the IT security lead approves any tool touching contract data.<\/li>\n      <li><strong>Timing.<\/strong> December draft solicitation is close.<\/li>\n      <li><strong>Risk already present.<\/strong> Some ChatGPT use on personal accounts, \"which I know isn't allowed\" (Capture and Proposal Lead). Worth raising with care.<\/li>\n    <\/ul>\n    <p class=\"src\">Tools today: Microsoft 365, SharePoint, Excel.<\/p>\n  <\/section>\n<\/div>\n\n<p class=\"foot\">FICTIONAL: Harborline and the call are invented for the Session 3 demo. AI draft: not reviewed. Every figure is from the call or marked ESTIMATE NEEDED; days-per-year totals are our arithmetic from the call numbers. Nothing has been sent to anyone. Template: knowledge/templates/ai-opportunity-map.txt.<\/p>\n\n<\/main>\n<\/body>\n<\/html>\n", "win-loss": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Win-loss log \u00b7 J2i (fictional data)<\/title>\n\n<style>\n/* J2i demo house style. Copy this whole file into a style block in each page.\n   Building blocks: .page  .eyebrow  h1  .lede  .strip  .grid  .card  .tag  .was/.now  table.compare  .src  .foot */\n:root{--bg:#f6f7f3;--surface:#fff;--ink:#17231d;--muted:#5f6d63;--line:#dfe5db;--accent:#2a4d3c;--soft:#e8f0e1;--warn:#9a4a1c;--warn-bg:#fbeee4;--ok:#2f6b47;--ok-bg:#e3f1e6}\n*{box-sizing:border-box}\nhtml{font-size:17px}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif;line-height:1.5}\n.page{max-width:1120px;margin:0 auto;padding:40px 28px 72px}\n.eyebrow{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}\nh1{font-size:2.3rem;line-height:1.08;letter-spacing:-.03em;font-weight:650;margin:.3rem 0 .6rem;text-wrap:balance}\nh2{font-size:1.35rem;letter-spacing:-.02em;font-weight:650;margin:0}\nh3{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:1.1rem 0 .35rem}\n.lede{color:var(--muted);max-width:66ch;font-size:1.05rem;margin:0 0 1.6rem}\na{color:var(--accent);text-underline-offset:2px}\np,ul,ol{margin:.3rem 0}\nul,ol{padding-left:1.15rem}\nli{margin:.2rem 0}\n.strip{background:var(--accent);color:#fff;border-radius:16px;padding:22px 26px;margin:0 0 22px}\n.strip h2,.strip h3{color:#fff}\n.strip a{color:#d4edaf}\n.strip .eyebrow{color:#cfe0d4}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:20px}\n@media(max-width:900px){.grid{grid-template-columns:1fr}}\n.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px}\n.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:4px}\n.card-head .date{font-size:.8rem;color:var(--muted)}\n.tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--accent);vertical-align:middle}\n.tag.warn{background:var(--warn-bg);color:var(--warn)}\n.tag.ok{background:var(--ok-bg);color:var(--ok)}\ntable.compare{width:100%;border-collapse:collapse;font-size:.95rem}\ntable.compare th{text-align:left;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600;opacity:.8;padding:6px 12px 6px 0}\ntable.compare td{padding:10px 12px 10px 0;border-top:1px solid rgba(255,255,255,.22);vertical-align:top}\n.card table.compare td{border-top:1px solid var(--line)}\n.was{opacity:.78}\n.now{font-weight:600}\n.src{font-size:.8rem;color:var(--muted);white-space:nowrap}\n.strip .src{color:#cfe0d4}\n.quote{border-left:3px solid var(--accent);padding:.15rem 0 .15rem .8rem;margin:.5rem 0}\n.foot{margin-top:28px;font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}\n@media print{body{background:#fff}.card{break-inside:avoid}}\n<\/style>\n<\/head>\n<body>\n<main class=\"page\">\n\n<div class=\"eyebrow\">J2 Intelligence Group \u00b7 Win-loss log \u00b7 started 12 October 2026 \u00b7 <span class=\"tag warn\">Fictional data<\/span> <span class=\"tag warn\">Draft, not reviewed<\/span><\/div>\n<h1>Win-loss log: what the first call and the first inbound week tell us<\/h1>\n<p class=\"lede\">Sources: calls/discovery-call.md and the files in inbound/ (week of 5 October 2026). All fictional. Titles only, no personal names. Reviewer: [TO CONFIRM: a named person].<\/p>\n\n<section class=\"strip\">\n  <div class=\"eyebrow\">Where the log stands<\/div>\n  <h2>0 won \u00b7 0 lost \u00b7 14 no decision<\/h2>\n  <p>Nobody has said yes or no to a J2i proposal yet. Every entry below is \"no decision\". For leads we would drop or park, \"no decision\" means the buyer never reached a choice and we made the call ourselves. The log shows that call in its own column, so these are not counted as losses. The patterns further down are hypotheses from a very small sample.<\/p>\n<\/section>\n\n<section class=\"card\" style=\"margin-bottom:22px\">\n  <div class=\"card-head\"><h2>A. Objections from the discovery call<\/h2><span class=\"date\">Harborline Systems Group (fictional) \u00b7 call \"last week\" [VERIFY date]<\/span><\/div>\n  <table class=\"compare\">\n    <tr><th>#<\/th><th>Objection, in their words<\/th><th>Said by<\/th><th>Outcome<\/th><th>Reason<\/th><th>Alternative the buyer considered<\/th><\/tr>\n    <tr>\n      <td>1<\/td>\n      <td>\"\u2026if we're buying another tool nobody opens.\"<\/td>\n      <td>COO [00:30]<\/td>\n      <td><span class=\"tag\">No decision<\/span><\/td>\n      <td>Fear of shelfware. Nothing proposed yet, so the deal is open.<\/td>\n      <td>An unnamed AI proposal tool trialled last year [VERIFY name]. ChatGPT on personal accounts is in use today, and the Capture and Proposal Lead says it isn't allowed.<\/td>\n    <\/tr>\n    <tr>\n      <td>2<\/td>\n      <td>\"It wrote confident nonsense about our past performance, made up a contract number. After that nobody trusted it.\"<\/td>\n      <td>Capture and Proposal Lead [16:20]<\/td>\n      <td><span class=\"tag\">No decision<\/span><\/td>\n      <td>A bad earlier experience with fabricated facts. Trust has to be rebuilt.<\/td>\n      <td>The same unnamed AI proposal tool [VERIFY name]. It was dropped after the trial.<\/td>\n    <\/tr>\n    <tr>\n      <td>3<\/td>\n      <td>\"I'm not putting something in front of a contracting officer that invents facts.\"<\/td>\n      <td>COO [16:20]<\/td>\n      <td><span class=\"tag\">No decision<\/span><\/td>\n      <td>A hard requirement: nothing invented may reach the customer.<\/td>\n      <td>None named.<\/td>\n    <\/tr>\n    <tr>\n      <td>4<\/td>\n      <td>\"\u2026it has to work on our own data. Some of it is controlled, so it can't go into just any tool.\"<\/td>\n      <td>COO [24:50]<\/td>\n      <td><span class=\"tag\">No decision<\/span><\/td>\n      <td>Controlled contract data limits which tools can be used.<\/td>\n      <td>None named.<\/td>\n    <\/tr>\n    <tr>\n      <td>5<\/td>\n      <td>\"Me for anything under fifty thousand. Our CEO signs above that. Our IT security lead has to approve any tool touching contract data.\"<\/td>\n      <td>COO [31:15]<\/td>\n      <td><span class=\"tag\">No decision<\/span><\/td>\n      <td>Approval gates: the CEO above the spend line, IT security for any tool. Currency not stated [VERIFY USD]. Whether the spend crosses the line: ESTIMATE NEEDED.<\/td>\n      <td>None named.<\/td>\n    <\/tr>\n    <tr>\n      <td>6<\/td>\n      <td>\"The draft solicitation is expected in December. Final in January.\" Later: \"December is close.\"<\/td>\n      <td>Capture and Proposal Lead [31:15]; COO [38:00]<\/td>\n      <td><span class=\"tag\">No decision<\/span><\/td>\n      <td>Time pressure rather than a refusal. Dates are expected, not confirmed [VERIFY].<\/td>\n      <td>None named.<\/td>\n    <\/tr>\n  <\/table>\n  <p class=\"src\">Not raised on the call: price, or whether AI is needed at all. Price was not discussed, so its absence is not evidence either way.<\/p>\n<\/section>\n\n<section class=\"card\" style=\"margin-bottom:22px\">\n  <div class=\"card-head\"><h2>B. Inbound leads we would drop or park<\/h2><span class=\"date\">inbound/ \u00b7 week of 5 October 2026<\/span><\/div>\n  <table class=\"compare\">\n    <tr><th>#<\/th><th>Lead (title, company)<\/th><th>Source<\/th><th>Our call<\/th><th>Outcome<\/th><th>Reason<\/th><th>Alternative considered<\/th><th>Scores B\u00b7A\u00b7R\u00b7C = total<\/th><\/tr>\n    <tr>\n      <td>7<\/td>\n      <td>Account Executive, and a Sales contact, CloudVantage Data (fictional)<\/td>\n      <td>LinkedIn DM; conference scan<\/td>\n      <td><span class=\"tag warn\">Drop<\/span><\/td>\n      <td><span class=\"tag\">No decision<\/span><\/td>\n      <td>A vendor pitching to us, not a buyer. Vendors are not a fit. One company, two contacts.<\/td>\n      <td>n/a<\/td>\n      <td>0\u00b70\u00b70\u00b70 = 0<\/td>\n    <\/tr>\n    <tr>\n      <td>8<\/td>\n      <td>Recent graduate<\/td>\n      <td>LinkedIn DM<\/td>\n      <td><span class=\"tag warn\">Drop<\/span><\/td>\n      <td><span class=\"tag\">No decision<\/span><\/td>\n      <td>Wants an internship and attached a CV. Not a buyer.<\/td>\n      <td>n/a<\/td>\n      <td>0\u00b70\u00b70\u00b70 = 0<\/td>\n    <\/tr>\n    <tr>\n      <td>9<\/td>\n      <td>Recruiter, Apex Talent Partners (fictional)<\/td>\n      <td>LinkedIn DM<\/td>\n      <td><span class=\"tag warn\">Drop<\/span><\/td>\n      <td><span class=\"tag\">No decision<\/span><\/td>\n      <td>Recruiting for a \"VP of AI\" role. Recruiters are not a fit.<\/td>\n      <td>n/a<\/td>\n      <td>0\u00b70\u00b70\u00b70 = 0<\/td>\n    <\/tr>\n    <tr>\n      <td>10<\/td>\n      <td>Student, State University<\/td>\n      <td>Conference scan<\/td>\n      <td><span class=\"tag warn\">Drop<\/span><\/td>\n      <td><span class=\"tag\">No decision<\/span><\/td>\n      <td>\"Collecting swag.\" Students are not a fit. No email domain captured.<\/td>\n      <td>n/a<\/td>\n      <td>0\u00b70\u00b70\u00b70 = 0<\/td>\n    <\/tr>\n    <tr>\n      <td>11<\/td>\n      <td>Founder, Kessler Tactical Logistics (fictional), 25 staff, DLA subcontracts<\/td>\n      <td>LinkedIn DM<\/td>\n      <td><span class=\"tag\">Park: nurture<\/span><\/td>\n      <td><span class=\"tag\">No decision<\/span><\/td>\n      <td>\"Not sure AI is for us yet.\" Small firm, no named pain. Likely kicking the tires. Below the assumed 50 to 500 staff.<\/td>\n      <td>None named.<\/td>\n      <td>0 (unknown) \u00b7 1 (Founder title) \u00b7 0 (unknown) \u00b7 0 = 1<\/td>\n    <\/tr>\n    <tr>\n      <td>12<\/td>\n      <td>Director of Operations, Meridian Clinic Group (fictional)<\/td>\n      <td>LinkedIn DM<\/td>\n      <td><span class=\"tag\">Park: until November<\/span><\/td>\n      <td><span class=\"tag\">No decision<\/span><\/td>\n      <td>They asked to pick it up in November. They named an \"intake triage idea\" rather than a pain, so clarity is borderline. Veteran ownership: unknown [VERIFY].<\/td>\n      <td>None named.<\/td>\n      <td>0 (unknown) \u00b7 0 (unknown) \u00b7 0 (unknown) \u00b7 1 (borderline) = 1<\/td>\n    <\/tr>\n    <tr>\n      <td>13<\/td>\n      <td>IT Manager, Ridgeback Engineering (fictional)<\/td>\n      <td>Conference scan<\/td>\n      <td><span class=\"tag\">Park: helpful email, 90-day follow-up<\/span><\/td>\n      <td><span class=\"tag\">No decision<\/span><\/td>\n      <td>Notes say \"no budget this year\". An IT manager is probably not the signer [VERIFY].<\/td>\n      <td>None named.<\/td>\n      <td>0 (no budget) \u00b7 0 (unknown) \u00b7 0 (unknown) \u00b7 0 (unknown) = 0<\/td>\n    <\/tr>\n    <tr>\n      <td>14<\/td>\n      <td>Operations lead at a veteran-owned logistics firm, 60 staff (fictional)<\/td>\n      <td>Marketplace post<\/td>\n      <td><span class=\"tag\">Park: fit call<\/span><\/td>\n      <td><span class=\"tag\">No decision<\/span><\/td>\n      <td>Wants weekly ops reports summarised and customer updates drafted, \"a few thousand dollars\", in two weeks. The pain is clear, but the budget and timeline may not match a discovery sprint. J2i pricing: [TO CONFIRM].<\/td>\n      <td>None named. It is a marketplace post, so other providers may also be bidding [VERIFY].<\/td>\n      <td>0 (unknown) \u00b7 0 (unknown) \u00b7 0 (unknown) \u00b7 1 (specific ask) = 1<\/td>\n    <\/tr>\n  <\/table>\n  <p class=\"src\">Not logged because we would pursue them: the COO of Harborline, the Capture Manager at Bluefield Federal Partners (recompete in Q1, wants a demo; scanned twice, so one is a duplicate row) and the CEO of Northpoint Mission Services (90 staff, interested in training). Scores: B = budget, A = authority, R = AI readiness, C = clarity, each 0 or 1.<\/p>\n<\/section>\n\n<section class=\"card\" style=\"margin-bottom:22px\">\n  <div class=\"card-head\"><h2>What we see<\/h2><span class=\"tag warn\">Small sample: one call, eleven inbound leads<\/span><\/div>\n\n  <h3>1. Half the dropped leads were never buyers<\/h3>\n  <p>Four of the eight (a vendor, a graduate, a recruiter and a student) fall outside the ideal client, and all four came through open channels (LinkedIn DMs and the conference scan). Two of the seven conference rows were non-buyers.<\/p>\n\n  <h3>2. The rest are small, early or not yet<\/h3>\n  <p>Kessler (25 staff, unsure about AI), Ridgeback (no budget), Meridian (asked for November) and the marketplace post (a few thousand dollars, two weeks) each lack size, budget or timing. This matches the CLAUDE.md note that small firms \"kick the tires\".<\/p>\n\n  <h3>3. The strong leads share one trigger: a dated recompete<\/h3>\n  <p>Harborline (March recompete, December solicitation) and Bluefield (recompete in Q1) are federal contractors with a deadline. Both came with proposal pain. The three leads we would pursue are all in the federal market.<\/p>\n\n  <h3>4. Every objection is about trust and control, none is about price<\/h3>\n  <p>All six objections concern invented facts, controlled data, approval gates, an unused tool or timing. Price never came up, but it was also never discussed. The earlier tool's fabricated contract number is the single most important fact on the call.<\/p>\n\n  <h3>5. No competitor was named<\/h3>\n  <p>The buyer named none. The only alternatives were an unnamed AI proposal tool they had dropped and personal ChatGPT use. GovDash, Sweetspot and APEX Accelerators, from CLAUDE.md, were not mentioned by anyone. Nothing here supports a claim about any of them.<\/p>\n\n  <h3>6. The first read of a lead was off<\/h3>\n  <p>The LinkedIn DM said \"about 140 people\" and a single task order. On the call the COO corrected this to 138 people and two task orders. The playback step caught it.<\/p>\n<\/section>\n\n<section class=\"card\" style=\"margin-bottom:22px\">\n  <div class=\"card-head\"><h2>What we should change<\/h2><span class=\"tag\">Suggestions for J2i to confirm<\/span><\/div>\n\n  <h3>Targeting<\/h3>\n  <ul>\n    <li><strong>Aim at one trigger.<\/strong> Put veteran-owned federal contractors with a recompete or solicitation date in the next six months at the front. Where those dates come from: [TO CONFIRM source].<\/li>\n    <li><strong>Ask for company type before booking.<\/strong> A single check on the conference form, and a quick look at each DM, would remove the four non-buyers before anyone spends time on them.<\/li>\n    <li><strong>Nurture the small and early ones, don't run discovery.<\/strong> Kessler, Ridgeback and Meridian each get a helpful email drafted for a person to send, with a calendar reminder: November for Meridian, 90 days for Ridgeback.<\/li>\n    <li><strong>Decide the marketplace post deliberately.<\/strong> Reply only if J2i has a small fixed-scope offer. Whether it does: [TO CONFIRM].<\/li>\n  <\/ul>\n\n  <h3>Messages<\/h3>\n  <ul>\n    <li><strong>Lead with \"nothing invented\".<\/strong> Say that every line points back to the source page or document, and that a person checks it. This answers objections 2 and 3 directly. Don't claim it until the build partner confirms it can do this: [TO CONFIRM].<\/li>\n    <li><strong>Raise data handling in the first conversation.<\/strong> Say plainly that we work only in tools the client's IT security approves, and invite the IT security lead to the scoping call (objections 4 and 5).<\/li>\n    <li><strong>Describe the work as finding and checking, not writing.<\/strong> \"AI writes your proposal\" is the claim the earlier tool made and broke.<\/li>\n    <li><strong>Tie the offer to their calendar.<\/strong> Quote the solicitation date back to them (objection 6) and show what is possible before it lands.<\/li>\n    <li><strong>Use shadow AI as an opening.<\/strong> Personal ChatGPT use is a risk the client already knows about. A short training-and-policy offer would answer it. Whether J2i wants to offer that: [TO CONFIRM].<\/li>\n  <\/ul>\n\n  <h3>The log itself<\/h3>\n  <ul>\n    <li><strong>Ask \"what else have you looked at?\" on every call<\/strong>, and get the name of the earlier tool from Harborline. Add a competitor only once a buyer names it.<\/li>\n    <li><strong>Record real won and lost outcomes<\/strong> as deals close. Until then, treat these patterns as hypotheses.<\/li>\n  <\/ul>\n<\/section>\n\n<p class=\"foot\">FICTIONAL: every company and person in these files is invented. AI draft: not reviewed. Nothing has been sent and nobody has been added to a sequence. Scores follow the four checks in CLAUDE.md; \"unknown\" means it could not be judged from the file, so it scored 0. Related: opportunity-map.html; the deal folder is knowledge/deals/harborline/.<\/p>\n\n<\/main>\n<\/body>\n<\/html>\n", "watch-changes": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Homepage changes: GovDash and Sweetspot<\/title>\n\n<style>\n/* J2i demo house style. Copy this whole file into a style block in each page.\n   Building blocks: .page  .eyebrow  h1  .lede  .strip  .grid  .card  .tag  .was/.now  table.compare  .src  .foot */\n:root{--bg:#f6f7f3;--surface:#fff;--ink:#17231d;--muted:#5f6d63;--line:#dfe5db;--accent:#2a4d3c;--soft:#e8f0e1;--warn:#9a4a1c;--warn-bg:#fbeee4;--ok:#2f6b47;--ok-bg:#e3f1e6}\n*{box-sizing:border-box}\nhtml{font-size:17px}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif;line-height:1.5}\n.page{max-width:1120px;margin:0 auto;padding:40px 28px 72px}\n.eyebrow{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}\nh1{font-size:2.3rem;line-height:1.08;letter-spacing:-.03em;font-weight:650;margin:.3rem 0 .6rem;text-wrap:balance}\nh2{font-size:1.35rem;letter-spacing:-.02em;font-weight:650;margin:0}\nh3{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:1.1rem 0 .35rem}\n.lede{color:var(--muted);max-width:66ch;font-size:1.05rem;margin:0 0 1.6rem}\na{color:var(--accent);text-underline-offset:2px}\np,ul,ol{margin:.3rem 0}\nul,ol{padding-left:1.15rem}\nli{margin:.2rem 0}\n.strip{background:var(--accent);color:#fff;border-radius:16px;padding:22px 26px;margin:0 0 22px}\n.strip h2,.strip h3{color:#fff}\n.strip a{color:#d4edaf}\n.strip .eyebrow{color:#cfe0d4}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:20px}\n@media(max-width:900px){.grid{grid-template-columns:1fr}}\n.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px}\n.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:4px}\n.card-head .date{font-size:.8rem;color:var(--muted)}\n.tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--accent);vertical-align:middle}\n.tag.warn{background:var(--warn-bg);color:var(--warn)}\n.tag.ok{background:var(--ok-bg);color:var(--ok)}\ntable.compare{width:100%;border-collapse:collapse;font-size:.95rem}\ntable.compare th{text-align:left;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600;opacity:.8;padding:6px 12px 6px 0}\ntable.compare td{padding:10px 12px 10px 0;border-top:1px solid rgba(255,255,255,.22);vertical-align:top}\n.card table.compare td{border-top:1px solid var(--line)}\n.was{opacity:.78}\n.now{font-weight:600}\n.src{font-size:.8rem;color:var(--muted);white-space:nowrap}\n.strip .src{color:#cfe0d4}\n.quote{border-left:3px solid var(--accent);padding:.15rem 0 .15rem .8rem;margin:.5rem 0}\n.foot{margin-top:28px;font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}\n@media print{body{background:#fff}.card{break-inside:avoid}}\n<\/style>\n<\/head>\n<body>\n<div class=\"page\">\n\n<div class=\"eyebrow\">J2i \u00b7 Watchlist \u00b7 Homepage changes \u00b7 12 October 2026 \u00b7 DRAFT, needs a named reviewer<\/div>\n<h1>GovDash and Sweetspot: what their homepages said then and now<\/h1>\n<p class=\"lede\">Visible text only, taken from Wayback Machine copies of each homepage from about a year ago and the most recent one saved. Wording in quotes is the vendors' own, not checked by J2i. We cannot say when between the two dates any change happened.<\/p>\n\n<div class=\"strip\">\n  <div class=\"eyebrow\">The two lines that matter most to J2i<\/div>\n  <h2>Sweetspot now tells buyers they do not need consultants<\/h2>\n  <p class=\"quote\">\u201cNo complex implementation. No consultants. Just connect your systems and start winning.\u201d<\/p>\n  <p class=\"src\">Sweetspot, 7 October 2026 copy. The 9 October 2025 copy has no such line. Sweetspot also now lists \u201cRecompete Tracking\u201d; the old copy does not mention recompetes.<\/p>\n<\/div>\n\n<h2>The copies compared<\/h2>\n<div class=\"grid\">\n\n  <div class=\"card\">\n    <div class=\"card-head\"><h2>GovDash<\/h2><span class=\"tag\">govdash.com<\/span><\/div>\n    <table class=\"compare\">\n      <tr><th>Version<\/th><th>Archive link<\/th><th>Saved file<\/th><\/tr>\n      <tr><td class=\"was\">Old: 12 October 2025<\/td><td><a href=\"https://web.archive.org/web/20251012150732/https://www.govdash.com/\">archive copy<\/a><\/td><td><a href=\"https://web.archive.org/web/20251012150732/https://www.govdash.com/\">watch/govdash_2025-10-12.html<\/a><\/td><\/tr>\n      <tr><td class=\"now\">New: 14 September 2026<\/td><td><a href=\"https://web.archive.org/web/20260914043812/https://www.govdash.com/\">archive copy<\/a><\/td><td><a href=\"https://web.archive.org/web/20260914043812/https://www.govdash.com/\">watch/govdash_2026-09-14.html<\/a><\/td><\/tr>\n    <\/table>\n    <p class=\"src\">The old copy is the one dated the same day a year ago. The new copy is the latest of two saved in September 2026; none are later.<\/p>\n  <\/div>\n\n  <div class=\"card\">\n    <div class=\"card-head\"><h2>Sweetspot<\/h2><span class=\"tag\">sweetspot.so<\/span><\/div>\n    <table class=\"compare\">\n      <tr><th>Version<\/th><th>Archive link<\/th><th>Saved file<\/th><\/tr>\n      <tr><td class=\"was\">Old: 9 October 2025<\/td><td><a href=\"https://web.archive.org/web/20251009075216/https://www.sweetspot.so/\">archive copy<\/a><\/td><td><a href=\"https://web.archive.org/web/20251009075216/https://www.sweetspot.so/\">watch/sweetspot_2025-10-09.html<\/a><\/td><\/tr>\n      <tr><td class=\"now\">New: 7 October 2026<\/td><td><a href=\"https://web.archive.org/web/20261007154804/https://www.sweetspot.so/\">archive copy<\/a><\/td><td><a href=\"https://web.archive.org/web/20261007154804/https://www.sweetspot.so/\">watch/sweetspot_2026-10-07.html<\/a><\/td><\/tr>\n    <\/table>\n    <p class=\"src\">The old copy is the closest saved one to 12 October 2025, three days earlier. The new copy is the last of four saved on 7 October 2026.<\/p>\n  <\/div>\n\n<\/div>\n\n<h2>Headline<\/h2>\n<div class=\"grid\">\n\n  <div class=\"card\">\n    <div class=\"card-head\"><h2>GovDash<\/h2><span class=\"tag\">changed<\/span><\/div>\n    <h3>Old<\/h3>\n    <p class=\"quote was\">\u201cAI for Government Contracting. Win contracts, advance missions.\u201d Under it: \u201cProduce high-quality proposals, run capture, organize your data and manage the full GovCon lifecycle. All in one place.\u201d Button: \u201cSee GovDash\u201d.<\/p>\n    <h3>New<\/h3>\n    <p class=\"quote now\">\u201cAI infrastructure to win government contracts.\u201d Under it: \u201cAccelerate BD, capture, proposals, pricing, contracts, and more. Top GovCons bring their teams and AI agents together on GovDash.\u201d Button: \u201cBook a demo\u201d.<\/p>\n  <\/div>\n\n  <div class=\"card\">\n    <div class=\"card-head\"><h2>Sweetspot<\/h2><span class=\"tag\">changed<\/span><\/div>\n    <h3>Old<\/h3>\n    <p class=\"quote was\">\u201cAI for Government Contracting.\u201d Under it: \u201cSweetspot leverages AI to help you find, manage, and bid on federal, state, local, and education government opportunities.\u201d Button: \u201cTry for free\u201d. A banner also said \u201cSweetspot AI Form Fill is now live!\u201d<\/p>\n    <h3>New<\/h3>\n    <p class=\"quote now\">\u201cAI for Government Contracting.\u201d Under it: \u201cSweetspot is AI for GovCon, bringing capture, pipeline management, and proposal writing into one secure platform.\u201d Button: \u201cSchedule a Demo\u201d.<\/p>\n  <\/div>\n\n<\/div>\n\n<h2>Who it is for<\/h2>\n<div class=\"grid\">\n\n  <div class=\"card\">\n    <div class=\"card-head\"><h2>GovDash<\/h2><span class=\"tag\">changed<\/span><\/div>\n    <h3>Old<\/h3>\n    <p class=\"quote was\">\u201cHundreds of teams have grown their businesses with GovDash.\u201d The demo form asked who they sell to (\u201cFederal\u201d, \u201cState and Local\u201d, \u201cBoth\u201d, \u201cNone, I am BD consultant\u201d), annual government contract revenue (\u201cUnder $10M\u201d up to \u201c$100M+\u201d), and team size (\u201cJust me\u201d up to \u201c500 +\u201d).<\/p>\n    <h3>New<\/h3>\n    <p class=\"quote now\">\u201c300+ teams have won billions with GovDash.\u201d The menu now has \u201cSmall Business\u201d, \u201cMid-Market\u201d and \u201cEnterprise\u201d, roles (\u201cCapture Managers\u201d, \u201cProposal Managers\u201d, \u201cLeadership\u201d and others), and sectors (\u201cDefense\u201d, \u201cFedCiv\u201d, \u201cHealth\u201d, \u201cSLED\u201d). The form is not in the new copy\u2019s visible text.<\/p>\n    <p class=\"src\">\u201cHundreds\u201d and \u201c300+\u201d are different wording. Do not read it as a change in customer count.<\/p>\n  <\/div>\n\n  <div class=\"card\">\n    <div class=\"card-head\"><h2>Sweetspot<\/h2><span class=\"tag\">changed<\/span><\/div>\n    <h3>Old<\/h3>\n    <p class=\"quote was\">\u201cTrusted by top public sector teams.\u201d<\/p>\n    <h3>New<\/h3>\n    <p class=\"quote now\">\u201cTrusted by leading government contractors.\u201d Also \u201cTrusted by Fortune 500 government contractors\u201d and \u201c500+ GovCon teams\u201d. FAQ: \u201cThe platform is designed for business development, capture, and proposal teams in government contracting firms with a history of past performance.\u201d<\/p>\n  <\/div>\n\n<\/div>\n\n<h2>What it covers<\/h2>\n<div class=\"grid\">\n\n  <div class=\"card\">\n    <div class=\"card-head\"><h2>GovDash<\/h2><span class=\"tag\">changed<\/span><\/div>\n    <h3>Old<\/h3>\n    <p class=\"quote was\">Five areas: \u201cOpportunity identification\u201d, \u201cCapture development\u201d, \u201cWinning proposals\u201d, \u201cContract management\u201d, \u201cAI assistants for everyone\u201d. Product menu: Capture Cloud, Proposal Cloud, Contract Cloud.<\/p>\n    <h3>New<\/h3>\n    <p class=\"quote now\">Five areas: \u201cDiscover\u201d, \u201cCapture\u201d, \u201cPricer\u201d, \u201cProposal\u201d, \u201cContracts\u201d. Also \u201cCRM\u201d, \u201cDash AI Agent\u201d, \u201cData Library\u201d, \u201cReports\u201d. Intro: \u201cRun opportunity identification, capture development, CRM, pricing, proposals, contracts and more - in one unified platform.\u201d<\/p>\n    <p class=\"src\">Pricing and CRM are new in the wording. The new copy\u2019s statistics are animated counters that show as \u201c0%\u201d in the saved text, so they are not quoted.<\/p>\n  <\/div>\n\n  <div class=\"card\">\n    <div class=\"card-head\"><h2>Sweetspot<\/h2><span class=\"tag\">changed<\/span><\/div>\n    <h3>Old<\/h3>\n    <p class=\"quote was\">Four areas: \u201cAI-Powered Search\u201d (federal, state and local, education, grants, SBIRs), \u201cAI Proposal Copilot\u201d (RFPs, RFIs, grants, SBIRs), \u201cProject Management\u201d, \u201cBusiness Intelligence\u201d. \u201c...over 18,000 unique agencies.\u201d<\/p>\n    <h3>New<\/h3>\n    <p class=\"quote now\">Six areas: \u201cOpportunity Discovery\u201d, \u201cFederal Market Intelligence\u201d, \u201cAgentic Monitors\u201d, \u201cPipeline Management\u201d, \u201cProposal Engine\u201d, \u201cOrganization Library\u201d. Adds \u201cDIBBS Contracts\u201d, \u201cTeaming Partner Search\u201d, \u201cCompetitor Analysis\u201d, \u201cGovWin Integration\u201d, \u201cGSA eBuy Integration\u201d. \u201cSearch 167M+ federal awards\u201d.<\/p>\n    <p class=\"src\">The new copy\u2019s visible text does not mention education contracts or SBIRs. That is not proof they were dropped.<\/p>\n  <\/div>\n\n<\/div>\n\n<h2>Security claims<\/h2>\n<div class=\"grid\">\n\n  <div class=\"card\">\n    <div class=\"card-head\"><h2>GovDash<\/h2><span class=\"tag\">changed<\/span><\/div>\n    <h3>Old<\/h3>\n    <p class=\"quote was\">\u201cGovDash complies with NIST 800-171 and FedRAMP Moderate standards, and runs in Azure / AWS GovCloud.\u201d \u201cAll GovDash employees are based in the United States.\u201d<\/p>\n    <h3>New<\/h3>\n    <p class=\"quote now\">\u201cFedRAMP Moderate Equivalent &amp; Ready: C3PAO audited and on the FedRAMP marketplace. NIST SP 800-53 aligned controls platform-wide.\u201d \u201cCUI Protection: DFARS 252.204-7012 compliance for CUI across storage, processing, and transmission.\u201d \u201cData Isolation: Your data is never used to train models or shared across customer boundaries.\u201d \u201cSelf-Hosted Option: Deploy in your own cloud environment for full infrastructure control.\u201d<\/p>\n    <p class=\"src\">The old wording said \u201ccomplies with... FedRAMP Moderate standards\u201d. The new wording says \u201cEquivalent &amp; Ready\u201d. Not compared further: we have not checked either claim.<\/p>\n  <\/div>\n\n  <div class=\"card\">\n    <div class=\"card-head\"><h2>Sweetspot<\/h2><span class=\"tag warn\">new<\/span><\/div>\n    <h3>Old<\/h3>\n    <p class=\"quote was\">No security claims in the visible text. One data line: the AI is \u201cprivately trained on your company\u2019s data.\u201d<\/p>\n    <h3>New<\/h3>\n    <p class=\"quote now\">Badges: \u201cCMMC L2\u201d, \u201cSOC 2 Type II\u201d, \u201cFedRAMP\u00ae Moderate Authorization (In Progress)\u201d. FAQ: \u201c...CMMC Level 2 and SOC 2 Type II certified. Sweetspot adheres to a zero data retention policy and provides granular role-based access controls...\u201d<\/p>\n    <p class=\"src\">Ties to the CMMC rule on the <a href=\"watchlist.html\">watchlist<\/a>. ASSUMPTION: the vendor\u2019s CMMC claim is its own and has not been checked against any official list.<\/p>\n  <\/div>\n\n<\/div>\n\n<h2>Consultants and recompetes<\/h2>\n<div class=\"grid\">\n\n  <div class=\"card\">\n    <div class=\"card-head\"><h2>GovDash<\/h2><span class=\"tag\">little change<\/span><\/div>\n    <h3>Old<\/h3>\n    <p class=\"quote was\">Consultants appear once, as a choice in the demo form: \u201cNone, I am BD consultant\u201d. Recompetes: not mentioned.<\/p>\n    <h3>New<\/h3>\n    <p class=\"quote now\">Neither consultants nor recompetes are mentioned in the visible text. \u201cProTeam\u201d is in the footer menu of both copies; what it is: UNKNOWN.<\/p>\n  <\/div>\n\n  <div class=\"card\">\n    <div class=\"card-head\"><h2>Sweetspot<\/h2><span class=\"tag warn\">new<\/span><\/div>\n    <h3>Old<\/h3>\n    <p class=\"quote was\">Consultants: not mentioned. Recompetes: not mentioned.<\/p>\n    <h3>New<\/h3>\n    <p class=\"quote now\">\u201cNo complex implementation. No consultants. Just connect your systems and start winning.\u201d Also \u201cRecompete Tracking: Track recompete opportunities\u201d, \u201cSearch 167M+ federal awards to find incumbents, partners, competitors, recompetes, and forecasts\u201d, and \u201c...including recompetes, sole-source-eligible contracts, and small business set-asides.\u201d<\/p>\n    <p class=\"src\">ASSUMPTION: the \u201cNo consultants\u201d line is aimed at implementation consultants in general, not J2i. The text does not say so.<\/p>\n  <\/div>\n\n<\/div>\n\n<div class=\"foot\">Method: homepage HTML downloaded from web.archive.org, scripts and styles removed, remaining text read side by side. Carousels, images, and anything loaded after the page opens may be missing. Text copies are saved next to each page in the watch folder as .txt files. Nothing here has been reviewed by a named person, so it is a draft.<\/div>\n\n<\/div>\n<\/body>\n<\/html>\n", "watchlist": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Watchlist: what a J2i buyer could choose instead<\/title>\n\n<style>\n/* J2i demo house style. Copy this whole file into a style block in each page.\n   Building blocks: .page  .eyebrow  h1  .lede  .strip  .grid  .card  .tag  .was/.now  table.compare  .src  .foot */\n:root{--bg:#f6f7f3;--surface:#fff;--ink:#17231d;--muted:#5f6d63;--line:#dfe5db;--accent:#2a4d3c;--soft:#e8f0e1;--warn:#9a4a1c;--warn-bg:#fbeee4;--ok:#2f6b47;--ok-bg:#e3f1e6}\n*{box-sizing:border-box}\nhtml{font-size:17px}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif;line-height:1.5}\n.page{max-width:1120px;margin:0 auto;padding:40px 28px 72px}\n.eyebrow{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}\nh1{font-size:2.3rem;line-height:1.08;letter-spacing:-.03em;font-weight:650;margin:.3rem 0 .6rem;text-wrap:balance}\nh2{font-size:1.35rem;letter-spacing:-.02em;font-weight:650;margin:0}\nh3{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:1.1rem 0 .35rem}\n.lede{color:var(--muted);max-width:66ch;font-size:1.05rem;margin:0 0 1.6rem}\na{color:var(--accent);text-underline-offset:2px}\np,ul,ol{margin:.3rem 0}\nul,ol{padding-left:1.15rem}\nli{margin:.2rem 0}\n.strip{background:var(--accent);color:#fff;border-radius:16px;padding:22px 26px;margin:0 0 22px}\n.strip h2,.strip h3{color:#fff}\n.strip a{color:#d4edaf}\n.strip .eyebrow{color:#cfe0d4}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:20px}\n@media(max-width:900px){.grid{grid-template-columns:1fr}}\n.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px}\n.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:4px}\n.card-head .date{font-size:.8rem;color:var(--muted)}\n.tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--accent);vertical-align:middle}\n.tag.warn{background:var(--warn-bg);color:var(--warn)}\n.tag.ok{background:var(--ok-bg);color:var(--ok)}\ntable.compare{width:100%;border-collapse:collapse;font-size:.95rem}\ntable.compare th{text-align:left;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600;opacity:.8;padding:6px 12px 6px 0}\ntable.compare td{padding:10px 12px 10px 0;border-top:1px solid rgba(255,255,255,.22);vertical-align:top}\n.card table.compare td{border-top:1px solid var(--line)}\n.was{opacity:.78}\n.now{font-weight:600}\n.src{font-size:.8rem;color:var(--muted);white-space:nowrap}\n.strip .src{color:#cfe0d4}\n.quote{border-left:3px solid var(--accent);padding:.15rem 0 .15rem .8rem;margin:.5rem 0}\n.foot{margin-top:28px;font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}\n@media print{body{background:#fff}.card{break-inside:avoid}}\n<\/style>\n<\/head>\n<body>\n<div class=\"page\">\n\n<div class=\"eyebrow\">J2i \u00b7 Competitive watchlist \u00b7 12 October 2026 \u00b7 DRAFT, needs a named reviewer<\/div>\n<h1>What a J2i buyer could choose instead of J2i<\/h1>\n<p class=\"lede\">Three alternatives a veteran-owned or government-contractor buyer may weigh: AI proposal software, free help, and other consultancies. Anything not confirmed is marked ASSUMPTION. No pricing is recorded here; ESTIMATE NEEDED if we want to compare.<\/p>\n\n<div class=\"strip\">\n  <div class=\"eyebrow\">How to use this page<\/div>\n  <h2>Check the watch pages on a fixed rhythm and note what changed<\/h2>\n  <p>ASSUMPTION: monthly is enough for software pricing and homepage claims. J2i has not set a cadence. Wording for a prospect who mentions one of these: acknowledge it honestly, never run it down.<\/p>\n<\/div>\n\n<div class=\"grid\">\n\n  <div class=\"card\">\n    <div class=\"card-head\"><h2>AI proposal software<\/h2><span class=\"tag\">Group 1<\/span><\/div>\n    <p>Tools a buyer could use to write bids and proposals in-house instead of paying for J2i's discovery and implementation.<\/p>\n\n    <h3>GovDash<\/h3>\n    <ul>\n      <li>Homepage: <a href=\"https://govdash.com\">govdash.com<\/a> <span class=\"src\">watch for: positioning, named customers, new features<\/span><\/li>\n      <li>Pricing: <a href=\"https://govdash.com/pricing\">govdash.com/pricing<\/a> <span class=\"src\">ASSUMPTION: this path exists; unchecked. If it does not, look from the homepage.<\/span><\/li>\n    <\/ul>\n\n    <h3>Sweetspot<\/h3>\n    <ul>\n      <li>Homepage: <a href=\"https://sweetspot.so\">sweetspot.so<\/a> <span class=\"src\">watch for: positioning, named customers, new features<\/span><\/li>\n      <li>Pricing: <a href=\"https://sweetspot.so/pricing\">sweetspot.so/pricing<\/a> <span class=\"src\">ASSUMPTION: this path exists; unchecked. If it does not, look from the homepage.<\/span><\/li>\n    <\/ul>\n\n    <p class=\"src\">What each product does and costs: UNKNOWN. Not researched for this page.<\/p>\n  <\/div>\n\n  <div class=\"card\">\n    <div class=\"card-head\"><h2>Free help<\/h2><span class=\"tag ok\">Group 2<\/span><\/div>\n    <p>APEX Accelerators: government-funded advisers who help businesses win government contracts at no cost to the business.<\/p>\n    <ul>\n      <li>Official site: <a href=\"https://www.apexaccelerators.us\">apexaccelerators.us<\/a> <span class=\"src\">ASSUMPTION: this is the official site address, from memory, unchecked.<\/span><\/li>\n      <li>Why it competes: free, local, and trusted by contractors. A buyer may try it first.<\/li>\n      <li>Where J2i differs: ASSUMPTION that APEX advises on getting contracts, not on applying AI inside the business. Confirm before saying so to a prospect.<\/li>\n    <\/ul>\n    <p class=\"src\">Which APEX office covers a given prospect: UNKNOWN until we have the prospect's location.<\/p>\n  <\/div>\n\n  <div class=\"card\">\n    <div class=\"card-head\"><h2>Other consultancies<\/h2><span class=\"tag warn\">Group 3<\/span><\/div>\n    <p>Firms selling AI strategy, discovery or training to the same buyers.<\/p>\n    <ul>\n      <li>Named competitors: none yet. UNKNOWN; J2i has not given us a list and none are invented here.<\/li>\n      <li>ASSUMPTION: the likeliest rivals are other veteran-owned consultancies, large integrators, and the buyer's existing IT or government-contracting adviser.<\/li>\n      <li>When a prospect names one, add it here with its homepage and any public pricing or offer page.<\/li>\n    <\/ul>\n  <\/div>\n\n<\/div>\n\n<h2>Two rules changing for these buyers this year<\/h2>\n<p class=\"lede\">Both affect government contractors. They shape what a buyer must spend on and what they will want AI to help with.<\/p>\n\n<div class=\"grid\">\n\n  <div class=\"card\">\n    <div class=\"card-head\"><h2>Revolutionary FAR Overhaul<\/h2><span class=\"tag\">Rule 1<\/span><\/div>\n    <p>The Federal Acquisition Regulation is being rewritten. Formal rulemaking began on 23 June 2026 with four proposed rules covering 20 FAR parts; 12 are planned to cover the whole FAR. Comments on the first four closed 23 July 2026. The target to finish by the end of 2026 is described by one source as ambitious.<\/p>\n    <ul>\n      <li>Official page: <a href=\"https://www.acquisition.gov/far-overhaul\">acquisition.gov/far-overhaul<\/a> <span class=\"src\">ASSUMPTION: this is the official page address, from memory. My search returned only law-firm and news pages, so I did not open it.<\/span><\/li>\n      <li>Why it matters to a buyer: proposal and compliance rules are changing, so proposal software and advice both need to keep up.<\/li>\n    <\/ul>\n    <p class=\"src\">Sources read: <a href=\"https://www.wiley.law/FAR-Overhaul-Rulemaking\">Wiley<\/a> \u00b7 <a href=\"https://federalnewsnetwork.com/acquisition-policy/2026/06/first-17-parts-of-the-far-move-into-formal-rulemaking-process/\">Federal News Network<\/a>. Federal News Network's headline says 17 parts; Wiley says 20. ASSUMPTION: the difference is how parts are counted. Check the official page.<\/p>\n  <\/div>\n\n  <div class=\"card\">\n    <div class=\"card-head\"><h2>CMMC Phase 2<\/h2><span class=\"tag warn\">Rule 2<\/span><\/div>\n    <p>Cybersecurity Maturity Model Certification. Several sources say Phase 2 starts 10 November 2026, when third-party Level 2 assessments become a condition of award for contracts handling controlled unclassified information. Assessor capacity is reported as tight, with waits of 6 to 12 months.<\/p>\n    <ul>\n      <li>Official page: <a href=\"https://dodcio.defense.gov/cmmc/\">dodcio.defense.gov/cmmc<\/a> <span class=\"src\">ASSUMPTION: this is the official DoD CIO program page, from memory. Not opened.<\/span><\/li>\n      <li>Not confirmed: one guide says the third-party Level 2 milestone is \"on hold\". No other source said so. Treat the 10 November date as UNCONFIRMED until the official page is read.<\/li>\n      <li>Why it matters to a buyer: compliance spend competes with AI spend. It also bears on J2i's data rule that client data goes only into approved tools.<\/li>\n    <\/ul>\n    <p class=\"src\">Sources read: <a href=\"https://secureframe.com/blog/cmmc-phase-2-preparation.md\">Secureframe<\/a> \u00b7 <a href=\"https://tritoncomputercorp.com/?p=52343\">Triton Computer Corp<\/a>. Both are vendor blogs, not official sources.<\/p>\n  <\/div>\n\n<\/div>\n\n<div class=\"foot\">Built from two web searches on 12 October 2026 plus J2i's context file. Nothing here has been reviewed by a named person, so it is a draft. Open the two official pages and the six software pages before using any of it with a client.<\/div>\n\n<\/div>\n<\/body>\n<\/html>\n", "contracts-ending": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Contracts ending 12 Oct 2026 to 30 Apr 2027<\/title>\n\n<style>\n/* J2i demo house style. Copy this whole file into a style block in each page.\n   Building blocks: .page  .eyebrow  h1  .lede  .strip  .grid  .card  .tag  .was/.now  table.compare  .src  .foot */\n:root{--bg:#f6f7f3;--surface:#fff;--ink:#17231d;--muted:#5f6d63;--line:#dfe5db;--accent:#2a4d3c;--soft:#e8f0e1;--warn:#9a4a1c;--warn-bg:#fbeee4;--ok:#2f6b47;--ok-bg:#e3f1e6}\n*{box-sizing:border-box}\nhtml{font-size:17px}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif;line-height:1.5}\n.page{max-width:1120px;margin:0 auto;padding:40px 28px 72px}\n.eyebrow{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}\nh1{font-size:2.3rem;line-height:1.08;letter-spacing:-.03em;font-weight:650;margin:.3rem 0 .6rem;text-wrap:balance}\nh2{font-size:1.35rem;letter-spacing:-.02em;font-weight:650;margin:0}\nh3{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:1.1rem 0 .35rem}\n.lede{color:var(--muted);max-width:66ch;font-size:1.05rem;margin:0 0 1.6rem}\na{color:var(--accent);text-underline-offset:2px}\np,ul,ol{margin:.3rem 0}\nul,ol{padding-left:1.15rem}\nli{margin:.2rem 0}\n.strip{background:var(--accent);color:#fff;border-radius:16px;padding:22px 26px;margin:0 0 22px}\n.strip h2,.strip h3{color:#fff}\n.strip a{color:#d4edaf}\n.strip .eyebrow{color:#cfe0d4}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:20px}\n@media(max-width:900px){.grid{grid-template-columns:1fr}}\n.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px}\n.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:4px}\n.card-head .date{font-size:.8rem;color:var(--muted)}\n.tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--accent);vertical-align:middle}\n.tag.warn{background:var(--warn-bg);color:var(--warn)}\n.tag.ok{background:var(--ok-bg);color:var(--ok)}\ntable.compare{width:100%;border-collapse:collapse;font-size:.95rem}\ntable.compare th{text-align:left;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600;opacity:.8;padding:6px 12px 6px 0}\ntable.compare td{padding:10px 12px 10px 0;border-top:1px solid rgba(255,255,255,.22);vertical-align:top}\n.card table.compare td{border-top:1px solid var(--line)}\n.was{opacity:.78}\n.now{font-weight:600}\n.src{font-size:.8rem;color:var(--muted);white-space:nowrap}\n.strip .src{color:#cfe0d4}\n.quote{border-left:3px solid var(--accent);padding:.15rem 0 .15rem .8rem;margin:.5rem 0}\n.foot{margin-top:28px;font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}\n@media print{body{background:#fff}.card{break-inside:avoid}}\n<\/style>\n<\/head>\n<body>\n<div class=\"page\">\n\n<div class=\"eyebrow\">J2i \u00b7 USAspending \u00b7 2026-10-12 \u00b7 DRAFT, needs a named reviewer<\/div>\n<h1>Who has contracts ending soon<\/h1>\n<p class=\"lede\">Veteran-owned and service-disabled veteran-owned firms, NAICS 5415 and 5416, awards of $1M to $20M, using each award\u2019s current End Date. Window: 12 October 2026 to 30 April 2027.<\/p>\n\n<div class=\"strip\">\n  <div class=\"eyebrow\">Result<\/div>\n  <h2>535 contracts, 287 companies; 23 look like resale businesses<\/h2>\n  <p>Ranked by number of contracts ending, then soonest end date. Firms whose awards are mostly hardware or software resale are taken out of the table below because they are not J2i\u2019s ideal client. Counts cover the 2,000 largest of 3,750 matching awards, so this is not the full list. <span class=\"src\">Source: <a href=\"data/usaspending_2026-10-12/manifest.json\">pull manifest<\/a><\/span><\/p>\n<\/div>\n\n<div class=\"card\">\n  <div class=\"card-head\"><h2>Top 15 services firms<\/h2><span class=\"tag ok\">not resale-heavy<\/span><\/div>\n  <table class=\"compare\">\n    <tr><th>#<\/th><th>Company<\/th><th>Contracts ending<\/th><th>Total value<\/th><th>Earliest end date<\/th><\/tr>\n    <tr><td>1<\/td><td>Cynergy Professional Systems LLC<\/td><td>6<\/td><td>$51,244,127<\/td><td>2026-11-15<\/td><\/tr>\n    <tr><td>2<\/td><td>Savvee Inc.<\/td><td>6<\/td><td>$47,547,029<\/td><td>2026-12-19<\/td><\/tr>\n    <tr><td>3<\/td><td>Grant Leading Technology LLC<\/td><td>6<\/td><td>$44,297,756<\/td><td>2027-01-02<\/td><\/tr>\n    <tr><td>4<\/td><td>Appddictionstudio Limited Liability Company<\/td><td>5<\/td><td>$45,539,325<\/td><td>2026-10-21<\/td><\/tr>\n    <tr><td>5<\/td><td>Stellar Innovations &amp; Solutions Inc.<\/td><td>5<\/td><td>$33,808,382<\/td><td>2026-10-26<\/td><\/tr>\n    <tr><td>6<\/td><td>Oddcore JV, LLC<\/td><td>5<\/td><td>$58,597,650<\/td><td>2026-11-01<\/td><\/tr>\n    <tr><td>7<\/td><td>Insignia Technology Services, LLC<\/td><td>5<\/td><td>$43,951,098<\/td><td>2026-12-22<\/td><\/tr>\n    <tr><td>8<\/td><td>DecisionPoint Corporation<\/td><td>5<\/td><td>$23,925,018<\/td><td>2026-12-29<\/td><\/tr>\n    <tr><td>9<\/td><td>ELB Services LLC<\/td><td>5<\/td><td>$25,420,691<\/td><td>2026-12-31<\/td><\/tr>\n    <tr><td>10<\/td><td>Your Recruiting Company, Inc.<\/td><td>5<\/td><td>$29,557,325<\/td><td>2026-12-31<\/td><\/tr>\n    <tr><td>11<\/td><td>Forge Group, LLC<\/td><td>4<\/td><td>$20,065,064<\/td><td>2026-10-17<\/td><\/tr>\n    <tr><td>12<\/td><td>Goldpath Communications JV LLC<\/td><td>4<\/td><td>$26,041,967<\/td><td>2026-12-04<\/td><\/tr>\n    <tr><td>13<\/td><td>T3I, Inc.<\/td><td>4<\/td><td>$40,689,283<\/td><td>2027-01-27<\/td><\/tr>\n    <tr><td>14<\/td><td>C5MI Insight LLC<\/td><td>3<\/td><td>$23,605,757<\/td><td>2026-10-15<\/td><\/tr>\n    <tr><td>15<\/td><td>2TECHJV, LLC<\/td><td>3<\/td><td>$17,670,869<\/td><td>2026-10-28<\/td><\/tr>\n  <\/table>\n  <p class=\"src\">Total value is the sum of each contract\u2019s whole-award amount, not what is left to spend. Ties on contracts ending are ordered by earliest end date.<\/p>\n  <p class=\"src\">Cynergy has 2 of 6 awards that read as resale (printers, radios). DecisionPoint has 1 of 5 (a SaaS tool). Both are mostly services, so they stay in.<\/p>\n<\/div>\n\n<h2>Flagged: mostly hardware or software resale<\/h2>\n<div class=\"grid\">\n\n  <div class=\"card\">\n    <div class=\"card-head\"><h2>Excluded from the table<\/h2><span class=\"tag warn\">resale-heavy<\/span><\/div>\n    <table class=\"compare\">\n      <tr><th>Company<\/th><th>Contracts ending<\/th><th>Of which resale<\/th><th>Earliest end date<\/th><\/tr>\n      <tr><td>Thundercat Technology, LLC<\/td><td>35<\/td><td>25<\/td><td>2026-10-29<\/td><\/tr>\n      <tr><td>Four Points Technology, L.L.C.<\/td><td>22<\/td><td>14<\/td><td>2026-10-30<\/td><\/tr>\n      <tr><td>Minburn Technology Group, LLC<\/td><td>16<\/td><td>12<\/td><td>2026-10-31<\/td><\/tr>\n      <tr><td>V3Gate, LLC<\/td><td>13<\/td><td>8<\/td><td>2026-10-31<\/td><\/tr>\n      <tr><td>Alvarez LLC<\/td><td>8<\/td><td>7<\/td><td>2026-10-31<\/td><\/tr>\n      <tr><td>Redhawk IT Solutions, LLC<\/td><td>8<\/td><td>7<\/td><td>2026-12-22<\/td><\/tr>\n      <tr><td>Colossal Contracting LLC<\/td><td>7<\/td><td>5<\/td><td>2026-12-29<\/td><\/tr>\n      <tr><td>Swish Data Corporation<\/td><td>6<\/td><td>6<\/td><td>2026-12-01<\/td><\/tr>\n      <tr><td>Metgreen Solutions Inc<\/td><td>6<\/td><td>4<\/td><td>2026-12-24<\/td><\/tr>\n      <tr><td>Regan Technologies Corp<\/td><td>3<\/td><td>3<\/td><td>2026-11-30<\/td><\/tr>\n      <tr><td>Techanax LLC<\/td><td>3<\/td><td>2<\/td><td>2027-02-21<\/td><\/tr>\n      <tr><td>Cykor LLC<\/td><td>2<\/td><td>2<\/td><td>2026-12-18<\/td><\/tr>\n    <\/table>\n    <p class=\"src\">Plus 11 firms with one contract ending each, all resale. Full list: <a href=\"data/usaspending_2026-10-12_clean/ending/ending_by_company.csv\">ending_by_company.csv<\/a>.<\/p>\n  <\/div>\n\n  <div class=\"card\">\n    <div class=\"card-head\"><h2>How it was decided<\/h2><span class=\"tag\">method<\/span><\/div>\n    <ul>\n      <li>Each contract\u2019s description was read by keyword rules and put in one of three groups: services, resale, or unclear. ASSUMPTION: the rules are mine, not J2i\u2019s, and are not a full review.<\/li>\n      <li>Resale means licences, subscriptions, named software or hardware products, renewals, or equipment purchases. Engineering, support, management, analysis and training services count as services, even when software is named.<\/li>\n      <li>A firm is flagged when more than half of its ending contracts are resale. Half exactly is not flagged.<\/li>\n      <li>66 of 535 contracts have descriptions too thin to tell, such as \u201cTASK ORDER #5\u201d. They count as not resale. Firms in the table with unclear ones: Grant Leading, Appddictionstudio, Stellar, Oddcore, DecisionPoint, Goldpath, C5MI.<\/li>\n      <li>I read the descriptions behind every firm in the table and checked them against this rule. The first rule version wrongly flagged AD Hoc Research; that is fixed.<\/li>\n    <\/ul>\n  <\/div>\n\n<\/div>\n\n<div class=\"foot\">Counts are from the 2,000 largest awards, not all 3,750. End Date is the field the API calls End Date, taken as the current end date. Not checked: whether the API\u2019s veteran-owned flags are right, or whether a firm has a parent company. Draft until a named person reviews it. Source data: <a href=\"data/usaspending_2026-10-12_clean/awards_clean.csv\">awards_clean.csv<\/a>.<\/div>\n\n<\/div>\n<\/body>\n<\/html>\n", "inbox": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Inbox decisions, week of 5 October 2026 (fictional)<\/title>\n\n<style>\n/* J2i demo house style. Copy this whole file into a style block in each page.\n   Building blocks: .page  .eyebrow  h1  .lede  .strip  .grid  .card  .tag  .was/.now  table.compare  .src  .foot */\n:root{--bg:#f6f7f3;--surface:#fff;--ink:#17231d;--muted:#5f6d63;--line:#dfe5db;--accent:#2a4d3c;--soft:#e8f0e1;--warn:#9a4a1c;--warn-bg:#fbeee4;--ok:#2f6b47;--ok-bg:#e3f1e6}\n*{box-sizing:border-box}\nhtml{font-size:17px}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif;line-height:1.5}\n.page{max-width:1120px;margin:0 auto;padding:40px 28px 72px}\n.eyebrow{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}\nh1{font-size:2.3rem;line-height:1.08;letter-spacing:-.03em;font-weight:650;margin:.3rem 0 .6rem;text-wrap:balance}\nh2{font-size:1.35rem;letter-spacing:-.02em;font-weight:650;margin:0}\nh3{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:1.1rem 0 .35rem}\n.lede{color:var(--muted);max-width:66ch;font-size:1.05rem;margin:0 0 1.6rem}\na{color:var(--accent);text-underline-offset:2px}\np,ul,ol{margin:.3rem 0}\nul,ol{padding-left:1.15rem}\nli{margin:.2rem 0}\n.strip{background:var(--accent);color:#fff;border-radius:16px;padding:22px 26px;margin:0 0 22px}\n.strip h2,.strip h3{color:#fff}\n.strip a{color:#d4edaf}\n.strip .eyebrow{color:#cfe0d4}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:20px}\n@media(max-width:900px){.grid{grid-template-columns:1fr}}\n.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px}\n.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:4px}\n.card-head .date{font-size:.8rem;color:var(--muted)}\n.tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--accent);vertical-align:middle}\n.tag.warn{background:var(--warn-bg);color:var(--warn)}\n.tag.ok{background:var(--ok-bg);color:var(--ok)}\ntable.compare{width:100%;border-collapse:collapse;font-size:.95rem}\ntable.compare th{text-align:left;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600;opacity:.8;padding:6px 12px 6px 0}\ntable.compare td{padding:10px 12px 10px 0;border-top:1px solid rgba(255,255,255,.22);vertical-align:top}\n.card table.compare td{border-top:1px solid var(--line)}\n.was{opacity:.78}\n.now{font-weight:600}\n.src{font-size:.8rem;color:var(--muted);white-space:nowrap}\n.strip .src{color:#cfe0d4}\n.quote{border-left:3px solid var(--accent);padding:.15rem 0 .15rem .8rem;margin:.5rem 0}\n.foot{margin-top:28px;font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}\n@media print{body{background:#fff}.card{break-inside:avoid}}\n<\/style>\n<\/head>\n<body>\n<div class=\"page\">\n\n<div class=\"eyebrow\">J2i \u00b7 Inbox \u00b7 week of 5 October 2026 \u00b7 <span class=\"tag warn\">FICTIONAL<\/span> \u00b7 DRAFT, needs a named reviewer<\/div>\n<h1>Inbox decisions<\/h1>\n<p class=\"lede\">Every person and company below is invented for the demo. Each lead gets one decision, keep, park or drop, with one reason. Where a reason rests on a guess it says ASSUMPTION.<\/p>\n\n<div class=\"strip\">\n  <div class=\"eyebrow\">Result<\/div>\n  <h2>14 items became 11 leads: keep 4, park 3, drop 4<\/h2>\n  <p>Three pairs are merged: Dana Whitfield (a DM and a scan), James Okafor (scanned twice), and the two CloudVantage Data salespeople, Marcus Reyes and Mike Torres, counted as one company lead. Sources: <a href=\"inbound/linkedin_dms.md\">LinkedIn DMs<\/a>, <a href=\"inbound/conference_scans.csv\">conference scans<\/a>, <a href=\"inbound/marketplace_post.md\">marketplace post<\/a>.<\/p>\n  <p class=\"src\">Keep = fits J2i\u2019s ideal client and shows a real problem. Park = a real business, not now. Drop = not a business lead.<\/p>\n<\/div>\n\n<div class=\"card\">\n  <div class=\"card-head\"><h2>Keep<\/h2><span class=\"tag ok\">4 \u00b7 fictional<\/span><\/div>\n  <table class=\"compare\">\n    <tr><th>Lead<\/th><th>Came in as<\/th><th>Reason<\/th><\/tr>\n    <tr>\n      <td>Dana Whitfield, COO, Harborline Systems Group<\/td>\n      <td class=\"src\">LinkedIn DM and conference scan<\/td>\n      <td>An SDVOSB of about 140 people with a VA task order up for recompete in the spring and an exhausted three-person proposal team; she asked twice, by DM and at the booth.<\/td>\n    <\/tr>\n    <tr>\n      <td>James Okafor, Capture Manager, Bluefield Federal Partners<\/td>\n      <td class=\"src\">Conference scan, entered twice<\/td>\n      <td>Has a recompete in Q1 and asked for a demo. ASSUMPTION: size and veteran ownership are not stated, so check both on the first call.<\/td>\n    <\/tr>\n    <tr>\n      <td>Angela Brooks, CEO, Northpoint Mission Services<\/td>\n      <td class=\"src\">Conference scan<\/td>\n      <td>An SDVOSB with 90 staff, the CEO is the person asking, and she is interested in training, which J2i sells.<\/td>\n    <\/tr>\n    <tr>\n      <td>Operations lead, veteran-owned logistics firm (60 staff)<\/td>\n      <td class=\"src\">Marketplace post<\/td>\n      <td>A clear job (summarise weekly ops reports, draft customer updates) and a budget number, though small. ASSUMPTION: it fits as a low-cost entry offer; two weeks may be too short, so scope it before agreeing.<\/td>\n    <\/tr>\n  <\/table>\n<\/div>\n\n<div class=\"card\">\n  <div class=\"card-head\"><h2>Park<\/h2><span class=\"tag\">3 \u00b7 fictional<\/span><\/div>\n  <table class=\"compare\">\n    <tr><th>Lead<\/th><th>Came in as<\/th><th>Reason<\/th><\/tr>\n    <tr>\n      <td>Laura Chen, Director of Operations, Meridian Clinic Group<\/td>\n      <td class=\"src\">LinkedIn DM<\/td>\n      <td>Still interested in the intake triage idea but asked to pick it up in November; reply and diary it for then.<\/td>\n    <\/tr>\n    <tr>\n      <td>Tom Kessler, Founder, Kessler Tactical Logistics<\/td>\n      <td class=\"src\">LinkedIn DM<\/td>\n      <td>A veteran-owned firm of 25 who say AI may not be for them yet; no problem named, so offer the coffee and nurture.<\/td>\n    <\/tr>\n    <tr>\n      <td>Kevin Park, IT Manager, Ridgeback Engineering<\/td>\n      <td class=\"src\">Conference scan<\/td>\n      <td>Noted \u201cno budget this year\u201d, so revisit next year.<\/td>\n    <\/tr>\n  <\/table>\n<\/div>\n\n<div class=\"card\">\n  <div class=\"card-head\"><h2>Drop<\/h2><span class=\"tag warn\">4 \u00b7 fictional<\/span><\/div>\n  <table class=\"compare\">\n    <tr><th>Lead<\/th><th>Came in as<\/th><th>Reason<\/th><\/tr>\n    <tr>\n      <td>Marcus Reyes (LinkedIn) and Mike Torres (scan), CloudVantage Data<\/td>\n      <td class=\"src\">LinkedIn DM and conference scan<\/td>\n      <td>A vendor trying to sell to J2i, not a buyer; the scan itself says \u201cvendor, pitching us\u201d.<\/td>\n    <\/tr>\n    <tr>\n      <td>Recruiter, Apex Talent Partners<\/td>\n      <td class=\"src\">LinkedIn DM<\/td>\n      <td>A recruiting pitch for a VP of AI role, not a business lead.<\/td>\n    <\/tr>\n    <tr>\n      <td>Priya Nair, recent graduate<\/td>\n      <td class=\"src\">LinkedIn DM<\/td>\n      <td>Asking for an AI internship, not buying anything.<\/td>\n    <\/tr>\n    <tr>\n      <td>Sarah Lin, Student, State University<\/td>\n      <td class=\"src\">Conference scan<\/td>\n      <td>Collecting swag, no company and no email.<\/td>\n    <\/tr>\n  <\/table>\n<\/div>\n\n<div class=\"foot\">Fictional demo data, not real people or companies. These are first-pass decisions from the messages alone; none of the four checks (budget, authority, AI readiness, clarity) has been scored, and no one has been contacted. Drop does not mean ignore: Priya and the recruiter may deserve a polite reply. Draft until a named person reviews it.<\/div>\n\n<\/div>\n<\/body>\n<\/html>\n"};
