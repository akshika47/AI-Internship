const PAGES={"battlecards": "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Battlecards: GovDash and Sweetspot<\/title>\n<style>\n/* J2i demo house style. Copy this whole file into a style block in each page.\n   Building blocks: .page  .eyebrow  h1  .lede  .strip  .grid  .card  .tag  .was/.now  table.compare  .src  .foot */\n:root{--bg:#f6f7f3;--surface:#fff;--ink:#17231d;--muted:#5f6d63;--line:#dfe5db;--accent:#2a4d3c;--soft:#e8f0e1;--warn:#9a4a1c;--warn-bg:#fbeee4;--ok:#2f6b47;--ok-bg:#e3f1e6}\n*{box-sizing:border-box}\nhtml{font-size:17px}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif;line-height:1.5}\n.page{max-width:1120px;margin:0 auto;padding:40px 28px 72px}\n.eyebrow{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}\nh1{font-size:2.3rem;line-height:1.08;letter-spacing:-.03em;font-weight:650;margin:.3rem 0 .6rem;text-wrap:balance}\nh2{font-size:1.35rem;letter-spacing:-.02em;font-weight:650;margin:0}\nh3{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:1.1rem 0 .35rem}\n.lede{color:var(--muted);max-width:66ch;font-size:1.05rem;margin:0 0 1.6rem}\na{color:var(--accent);text-underline-offset:2px}\np,ul,ol{margin:.3rem 0}\nul,ol{padding-left:1.15rem}\nli{margin:.2rem 0}\n.strip{background:var(--accent);color:#fff;border-radius:16px;padding:22px 26px;margin:0 0 22px}\n.strip h2,.strip h3{color:#fff}\n.strip a{color:#d4edaf}\n.strip .eyebrow{color:#cfe0d4}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:20px}\n@media(max-width:900px){.grid{grid-template-columns:1fr}}\n.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px}\n.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:4px}\n.card-head .date{font-size:.8rem;color:var(--muted)}\n.tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--accent);vertical-align:middle}\n.tag.warn{background:var(--warn-bg);color:var(--warn)}\n.tag.ok{background:var(--ok-bg);color:var(--ok)}\ntable.compare{width:100%;border-collapse:collapse;font-size:.95rem}\ntable.compare th{text-align:left;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600;opacity:.8;padding:6px 12px 6px 0}\ntable.compare td{padding:10px 12px 10px 0;border-top:1px solid rgba(255,255,255,.22);vertical-align:top}\n.card table.compare td{border-top:1px solid var(--line)}\n.was{opacity:.78}\n.now{font-weight:600}\n.src{font-size:.8rem;color:var(--muted);white-space:nowrap}\n.strip .src{color:#cfe0d4}\n.quote{border-left:3px solid var(--accent);padding:.15rem 0 .15rem .8rem;margin:.5rem 0}\n.foot{margin-top:28px;font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}\n@media print{body{background:#fff}.card{break-inside:avoid}}\n<\/style>\n<\/head>\n<body>\n<div class=\"page\">\n  <div class=\"eyebrow\">Battlecards \u00b7 AI proposal software \u00b7 Draft for review by [reviewer name TO CONFIRM]<\/div>\n  <h1>GovDash and Sweetspot: what changed, and how to talk about them<\/h1>\n  <p class=\"lede\">Built from each vendor's own homepage, saved from the Wayback Machine about a year apart. Vendor claims are shown as claims, not as verified fact. Every AI output here is a draft until a named person reviews it.<\/p>\n\n  <div class=\"card\" style=\"margin-bottom:22px\">\n    <div class=\"card-head\"><h2>What changed on the homepage<\/h2><span class=\"date\">Old copies: 9 and 12 Oct 2025 \u00b7 New copies: 14 Sep and 7 Oct 2026<\/span><\/div>\n    <table class=\"compare\">\n      <thead><tr><th>Vendor \u00b7 topic<\/th><th>Old wording<\/th><th>New wording<\/th><th>Archive copies<\/th><\/tr><\/thead>\n      <tbody>\n        <tr><td><span class=\"tag\">GovDash<\/span><br>Headline<\/td><td class=\"was\">\"Win contracts, advance missions\"<\/td><td class=\"now\">\"AI infrastructure to win government contracts\"<\/td><td class=\"src\" rowspan=\"5\"><a href=\"https://web.archive.org/web/20251012150732/https://www.govdash.com/\">Old, 12 Oct 2025<\/a><br><a href=\"https://web.archive.org/web/20260914043812/https://www.govdash.com/\">New, 14 Sep 2026<\/a><br><a href=\"https://web.archive.org/web/20251012150732/https://www.govdash.com/\">saved old<\/a> \u00b7 <a href=\"https://web.archive.org/web/20260914043812/https://www.govdash.com/\">saved new<\/a><\/td><\/tr>\n        <tr><td>Scale<\/td><td class=\"was\">\"Hundreds of teams have grown their businesses with GovDash\"<\/td><td class=\"now\">\"300+ teams have won billions with GovDash\"<\/td><\/tr>\n        <tr><td>Scope<\/td><td class=\"was\">Capture, proposals, contract management, \"AI assistants for everyone\"<\/td><td class=\"now\">Adds pricing (\"Pricer\") and \"AI agents\"; navigation now lists a \"Dash AI Agent\" and pages for Small Business, Mid-Market and Enterprise<\/td><\/tr>\n        <tr><td>Security<\/td><td class=\"was\">\"complies with NIST 800-171 and FedRAMP Moderate standards, and runs in Azure / AWS GovCloud\"<\/td><td class=\"now\">\"FedRAMP Moderate Equivalent &amp; Ready\"; \"C3PAO audited and on the FedRAMP marketplace\"; adds a \"Self-Hosted Option\"<\/td><\/tr>\n        <tr><td>Call to action<\/td><td class=\"was\">\"See GovDash\"; a form asking for contract revenue and team size, to \"get your custom quote started\"<\/td><td class=\"now\">\"Book a demo\"; a 30-minute walkthrough where you \"bring a real pursuit\"<\/td><\/tr>\n        <tr><td><span class=\"tag\">Sweetspot<\/span><br>What it is<\/td><td class=\"was\">\"help you find, manage, and bid on federal, state, local, and education government opportunities\"<\/td><td class=\"now\">\"bringing capture, pipeline management, and proposal writing into one secure platform\"<\/td><td class=\"src\" rowspan=\"5\"><a href=\"https://web.archive.org/web/20251009075216/https://www.sweetspot.so/\">Old, 9 Oct 2025<\/a><br><a href=\"https://web.archive.org/web/20261007154804/https://www.sweetspot.so/\">New, 7 Oct 2026<\/a><br><a href=\"https://web.archive.org/web/20251009075216/https://www.sweetspot.so/\">saved old<\/a> \u00b7 <a href=\"https://web.archive.org/web/20261007154804/https://www.sweetspot.so/\">saved new<\/a><\/td><\/tr>\n        <tr><td>Call to action<\/td><td class=\"was\">\"Try for free\"; \"Sign Up\"<\/td><td class=\"now\">\"Schedule a Demo\"; \"Request Demo\"<\/td><\/tr>\n        <tr><td>Coverage<\/td><td class=\"was\">Access to \"over 18,000 unique agencies\"<\/td><td class=\"now\">\"Search 167M+ federal awards\"; \"1,000+ state and local sources\"<\/td><\/tr>\n        <tr><td>Data and security<\/td><td class=\"was\">Copilot \"privately trained on your company's data\"<\/td><td class=\"now\">\"CMMC L2\", \"SOC 2 Type II\", \"FedRAMP Moderate Authorization (In Progress)\"; \"zero data retention policy\"<\/td><\/tr>\n        <tr><td>Setup<\/td><td class=\"was\">Not stated on the page<\/td><td class=\"now\">\"Up and running in days, not months. No complex implementation. No consultants.\"<\/td><\/tr>\n      <\/tbody>\n    <\/table>\n    <p class=\"src\" style=\"white-space:normal;margin-top:10px\">Sweetspot's old copy is the closest saved one to a year ago (three days earlier). The two newest Sweetspot copies are byte-identical. The 14 Sep GovDash copy differs from the 1 Sep copy in visible text only by a removed news banner.<\/p>\n  <\/div>\n\n  <div class=\"grid\">\n    <div class=\"card\">\n      <div class=\"card-head\"><h2>GovDash<\/h2><span class=\"tag\">govdash.com<\/span><\/div>\n      <h3>What they say now<\/h3>\n      <p>An \"AI infrastructure\" for the whole GovCon cycle: discover, capture, price, propose, manage contracts, with AI agents. Says it grounds output in your own past performance and documents and cites sources. <span class=\"src\"><a href=\"https://web.archive.org/web/20260914043812/https://www.govdash.com/\">source<\/a><\/span><\/p>\n      <h3>Where they are strong<\/h3>\n      <ul>\n        <li>Covers more of the lifecycle than proposals alone, including pricing and contracts.<\/li>\n        <li>Detailed security story on the page: DFARS 252.204-7012, US-based staff, a self-hosted option (their claims).<\/li>\n        <li>Named onboarding plan: Day 1, Day 5, Day 30.<\/li>\n      <\/ul>\n      <h3>Where J2i fits<\/h3>\n      <ul>\n        <li>A discovery sprint and one-page AI Opportunity Map before or alongside a platform decision.<\/li>\n        <li>Training so the team uses AI on real work, beyond the tool's own screens.<\/li>\n        <li>Getting past performance, templates and process into shape, which the platform depends on.<\/li>\n      <\/ul>\n      <h3>Ask a buyer who is considering them<\/h3>\n      <ol>\n        <li>Which of capture, proposals, pricing and contracts will your team actually use in the first 30 days, and who owns each?<\/li>\n        <li>Where do your past performance and proposal templates live today, and how current are they?<\/li>\n        <li>What will IT security need to see before approving it, and who gets the current documents from the vendor?<\/li>\n      <\/ol>\n      <h3>Likely objections, honest answers<\/h3>\n      <ul>\n        <li><b>\"They include white-glove onboarding.\"<\/b> They say so on their page. That covers setting up the tool. It does not cover which workflows change or how the team is trained. If the tool is all you need, their onboarding may be enough.<\/li>\n        <li><b>\"It is built for GovCon.\"<\/b> It is, and J2i does not sell a platform. J2i's GovCon experience: [TO CONFIRM].<\/li>\n        <li><b>\"It is FedRAMP Moderate equivalent.\"<\/b> That is their wording. Ask for current documents; J2i cannot vouch for it.<\/li>\n      <\/ul>\n      <h3>Why J2i wins<\/h3>\n      <p><span class=\"tag warn\">[TO CONFIRM]<\/span><\/p>\n    <\/div>\n\n    <div class=\"card\">\n      <div class=\"card-head\"><h2>Sweetspot<\/h2><span class=\"tag\">sweetspot.so<\/span><\/div>\n      <h3>What they say now<\/h3>\n      <p>\"AI for GovCon\": capture, pipeline management and proposal writing in one secure platform, with agentic monitors and a \"shred and draft\" proposal process. Built for teams \"with a history of past performance\". <span class=\"src\"><a href=\"https://web.archive.org/web/20261007154804/https://www.sweetspot.so/\">source<\/a><\/span><\/p>\n      <h3>Where they are strong<\/h3>\n      <ul>\n        <li>Wide discovery: SAM.gov, Grants.gov, DIBBS, state and local, award data, teaming and recompete search (as listed).<\/li>\n        <li>Named integrations: SharePoint, Salesforce, GSA eBuy, GovWin.<\/li>\n        <li>Security badges on the page: CMMC L2, SOC 2 Type II (their claims).<\/li>\n      <\/ul>\n      <h3>Where J2i fits<\/h3>\n      <ul>\n        <li>Helping a firm decide whether its gap is finding, qualifying or writing, before it buys.<\/li>\n        <li>Training and review habits so drafts are checked by a named person before they go anywhere.<\/li>\n        <li>Work around the tool that a software vendor does not sell: data readiness and process.<\/li>\n      <\/ul>\n      <h3>Ask a buyer who is considering them<\/h3>\n      <ol>\n        <li>Is your biggest gap finding opportunities, qualifying them, or writing the response?<\/li>\n        <li>Which sources must it cover for you, and what do you already pay for today?<\/li>\n        <li>Who reviews an AI draft before submission, and how is that review recorded?<\/li>\n      <\/ol>\n      <h3>Likely objections, honest answers<\/h3>\n      <ul>\n        <li><b>\"They say no consultants needed.\"<\/b> Their page says so. Setup may be quick. The open question is whether your data and process are ready and what changes for the team. A firm that only needs the tool may not need J2i.<\/li>\n        <li><b>\"I can try it free.\"<\/b> The 2025 page offered \"Try for free\". The 2026 page shows demo requests and a Pricing link. Check current terms with the vendor.<\/li>\n        <li><b>\"It targets firms with past performance.\"<\/b> Right, so ask the buyer whether they have records ready to load.<\/li>\n      <\/ul>\n      <h3>Why J2i wins<\/h3>\n      <p><span class=\"tag warn\">[TO CONFIRM]<\/span><\/p>\n    <\/div>\n  <\/div>\n\n  <div class=\"strip\" style=\"margin-top:22px\">\n    <div class=\"eyebrow\">Market \u00b7 two rules changing for these buyers this year<\/div>\n    <h3 style=\"margin-top:.6rem\">1. CMMC Phase 2 (Level 2 third-party certification)<\/h3>\n    <p>Start date <b>10 Nov 2026<\/b> per one source, which makes third-party (C3PAO) assessment the default for contracts with controlled unclassified information. <span class=\"src\"><a href=\"https://secureframe.com/blog/cmmc-phase-2-preparation.md\">Secureframe<\/a><\/span><\/p>\n    <p><b>Sources disagree.<\/b> That same page carries a note that the move to Phase 2 is \"on hold\", and a July 2026 law-firm review says the Department of Defense \"suspended the next phase\". Neither gives a new date. Confirm with the Department of Defense before telling a buyer. <span class=\"src\"><a href=\"https://www.faegredrinker.com/en/insights/publications/2026/7/second-quarter-2026-government-contracts-policy-and-regulatory-review\">Faegre Drinker<\/a><\/span><\/p>\n    <h3>2. Federal Acquisition Regulation overhaul<\/h3>\n    <p>Four proposed rules were published on 23 June 2026. Comments on the first round were due 23 July 2026, and final rules remain pending on several matters. Single source, not cross-checked. <span class=\"src\"><a href=\"https://www.faegredrinker.com/en/insights/publications/2026/7/second-quarter-2026-government-contracts-policy-and-regulatory-review\">Faegre Drinker<\/a><\/span><\/p>\n  <\/div>\n\n  <div class=\"card\">\n    <div class=\"card-head\"><h2>Removed because it could not be backed up<\/h2><\/div>\n    <ul>\n      <li>Vendor results figures (GovDash 150%, 60%, 3x, $10B+; Sweetspot 10x, 80%, 20% win rate, $3B+). They are marketing claims on the vendors' own pages, with no outside check.<\/li>\n      <li>Any pricing for either vendor. Neither homepage states a price.<\/li>\n      <li>Customer testimonials and the people and companies quoted. Names are left out under the house rules.<\/li>\n      <li>\"GovDash is FedRAMP authorized\" and \"Sweetspot is CMMC certified\" as facts. Both appear only as the vendors' own statements, shown as claims above.<\/li>\n      <li>From the two market searches: CMMC cost and assessor-capacity figures, and flow-down detail (compliance-vendor sources, not checked); size recertification, Part 19 and cost accounting threshold detail for the Federal Acquisition Regulation (search summaries only, pages not opened).<\/li>\n      <li>Funding, headcount, customer counts and market share for either vendor. Not on the saved pages.<\/li>\n      <li>Anything about J2i's past performance, certifications, pricing or why J2i wins: [TO CONFIRM].<\/li>\n      <li>Sweetspot \"Teams\" and \"Contracts won\" counters: blank or duplicated in the saved copy.<\/li>\n    <\/ul>\n  <\/div>\n\n  <p class=\"foot\">Draft. Every claim about another company links to its archive copy or source. Nothing here has been sent to anyone. Saved copies are in watch/. Search budget used: 2 of 2.<\/p>\n<\/div>\n\n<\/body><\/html>\n", "call-prep": "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Call prep: why not just buy the software?<\/title>\n<style>\n/* J2i demo house style. Copy this whole file into a style block in each page.\n   Building blocks: .page  .eyebrow  h1  .lede  .strip  .grid  .card  .tag  .was/.now  table.compare  .src  .foot */\n:root{--bg:#f6f7f3;--surface:#fff;--ink:#17231d;--muted:#5f6d63;--line:#dfe5db;--accent:#2a4d3c;--soft:#e8f0e1;--warn:#9a4a1c;--warn-bg:#fbeee4;--ok:#2f6b47;--ok-bg:#e3f1e6}\n*{box-sizing:border-box}\nhtml{font-size:17px}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif;line-height:1.5}\n.page{max-width:1120px;margin:0 auto;padding:40px 28px 72px}\n.eyebrow{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}\nh1{font-size:2.3rem;line-height:1.08;letter-spacing:-.03em;font-weight:650;margin:.3rem 0 .6rem;text-wrap:balance}\nh2{font-size:1.35rem;letter-spacing:-.02em;font-weight:650;margin:0}\nh3{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:1.1rem 0 .35rem}\n.lede{color:var(--muted);max-width:66ch;font-size:1.05rem;margin:0 0 1.6rem}\na{color:var(--accent);text-underline-offset:2px}\np,ul,ol{margin:.3rem 0}\nul,ol{padding-left:1.15rem}\nli{margin:.2rem 0}\n.strip{background:var(--accent);color:#fff;border-radius:16px;padding:22px 26px;margin:0 0 22px}\n.strip h2,.strip h3{color:#fff}\n.strip a{color:#d4edaf}\n.strip .eyebrow{color:#cfe0d4}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:20px}\n@media(max-width:900px){.grid{grid-template-columns:1fr}}\n.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px}\n.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:4px}\n.card-head .date{font-size:.8rem;color:var(--muted)}\n.tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--accent);vertical-align:middle}\n.tag.warn{background:var(--warn-bg);color:var(--warn)}\n.tag.ok{background:var(--ok-bg);color:var(--ok)}\ntable.compare{width:100%;border-collapse:collapse;font-size:.95rem}\ntable.compare th{text-align:left;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600;opacity:.8;padding:6px 12px 6px 0}\ntable.compare td{padding:10px 12px 10px 0;border-top:1px solid rgba(255,255,255,.22);vertical-align:top}\n.card table.compare td{border-top:1px solid var(--line)}\n.was{opacity:.78}\n.now{font-weight:600}\n.src{font-size:.8rem;color:var(--muted);white-space:nowrap}\n.strip .src{color:#cfe0d4}\n.quote{border-left:3px solid var(--accent);padding:.15rem 0 .15rem .8rem;margin:.5rem 0}\n.foot{margin-top:28px;font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}\n@media print{body{background:#fff}.card{break-inside:avoid}}\n<\/style>\n<\/head>\n<body>\n<div class=\"page\">\n  <div class=\"eyebrow\">Call prep \u00b7 COO of a veteran-owned contractor, also looking at Sweetspot \u00b7 Draft for review by [reviewer name TO CONFIRM]<\/div>\n  <h1>\"Why not just buy the software?\"<\/h1>\n  <p class=\"lede\">Everything here comes from <a href=\"battlecards.html\">battlecards.html<\/a> and nothing else. Each point names the card and the line it comes from. Say it in your own words.<\/p>\n\n  <div class=\"strip\">\n    <div class=\"eyebrow\">30-second answer \u00b7 about 80 words<\/div>\n    <p style=\"font-size:1.1rem;margin-top:.6rem\">\"The software may well be the right buy. Sweetspot says setup is quick, and that may hold. The open question is whether your data and process are ready, and what changes for your team. That is the part J2i helps with: deciding whether your gap is finding, qualifying or writing before you buy, and training with a named person reviewing every draft. If the tool is all you need, you may not need us.\"<\/p>\n  <\/div>\n\n  <div class=\"card\" style=\"margin-bottom:22px\">\n    <div class=\"card-head\"><h2>Where each sentence comes from<\/h2><span class=\"date\">All lines are on the Sweetspot card<\/span><\/div>\n    <table class=\"compare\">\n      <thead><tr><th>You say<\/th><th>Card line<\/th><\/tr><\/thead>\n      <tbody>\n        <tr><td>\"Sweetspot says setup is quick, and that may hold.\"<\/td><td class=\"src\" style=\"white-space:normal\">Likely objections, honest answers \u203a <b>\"They say no consultants needed.\"<\/b> (\"Their page says so. Setup may be quick.\") Also in the What changed table, row Sweetspot \u00b7 Setup.<\/td><\/tr>\n        <tr><td>\"The open question is whether your data and process are ready, and what changes for your team.\"<\/td><td class=\"src\" style=\"white-space:normal\">Same objection: \"The open question is whether your data and process are ready and what changes for the team.\"<\/td><\/tr>\n        <tr><td>\"Deciding whether your gap is finding, qualifying or writing before you buy.\"<\/td><td class=\"src\" style=\"white-space:normal\">Where J2i fits \u203a first bullet: \"Helping a firm decide whether its gap is finding, qualifying or writing, before it buys.\"<\/td><\/tr>\n        <tr><td>\"Training with a named person reviewing every draft.\"<\/td><td class=\"src\" style=\"white-space:normal\">Where J2i fits \u203a second bullet: \"Training and review habits so drafts are checked by a named person before they go anywhere.\"<\/td><\/tr>\n        <tr><td>\"If the tool is all you need, you may not need us.\"<\/td><td class=\"src\" style=\"white-space:normal\">Same \"no consultants\" objection: \"A firm that only needs the tool may not need J2i.\"<\/td><\/tr>\n      <\/tbody>\n    <\/table>\n  <\/div>\n\n  <div class=\"card\" style=\"margin-bottom:22px\">\n    <div class=\"card-head\"><h2>Three questions to ask<\/h2><span class=\"date\">Sweetspot card \u203a Ask a buyer who is considering them<\/span><\/div>\n    <ol>\n      <li><b>Is your biggest gap finding opportunities, qualifying them, or writing the response?<\/b><br><span class=\"src\">Question 1 on the Sweetspot card.<\/span><\/li>\n      <li><b>Which sources must it cover for you, and what do you already pay for today?<\/b><br><span class=\"src\">Question 2 on the Sweetspot card.<\/span><\/li>\n      <li><b>Who reviews an AI draft before submission, and how is that review recorded?<\/b><br><span class=\"src\">Question 3 on the Sweetspot card.<\/span><\/li>\n    <\/ol>\n  <\/div>\n\n  <div class=\"card\">\n    <div class=\"card-head\"><h2>If they push back, the card also has<\/h2><\/div>\n    <ul>\n      <li><b>\"I can try it free.\"<\/b> The 2025 page offered \"Try for free\"; the 2026 page shows demo requests and a Pricing link. Check current terms with the vendor. <span class=\"src\">Sweetspot card \u203a Likely objections, second bullet.<\/span><\/li>\n      <li><b>\"It targets firms with past performance.\"<\/b> Ask whether they have records ready to load. <span class=\"src\">Sweetspot card \u203a Likely objections, third bullet.<\/span><\/li>\n    <\/ul>\n    <h3>What the card cannot give you<\/h3>\n    <ul>\n      <li>Why J2i wins: <span class=\"tag warn\">[TO CONFIRM]<\/span> on the Sweetspot card. Do not claim it on the call.<\/li>\n      <li>J2i past performance, pricing or certifications: not on the card. Say [TO CONFIRM] to yourself and offer to follow up.<\/li>\n      <li>Anything about this COO's firm: the card has none. Treat the answers to the three questions as new facts to write down.<\/li>\n    <\/ul>\n  <\/div>\n\n  <p class=\"foot\">Draft. Drawn only from battlecards.html. Nothing here has been sent to anyone.<\/p>\n<\/div>\n\n<\/body><\/html>\n", "targets": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Targets: who to call first<\/title>\n\n<style>\n/* J2i demo house style. Copy this whole file into a style block in each page.\n   Building blocks: .page  .eyebrow  h1  .lede  .strip  .grid  .card  .tag  .was/.now  table.compare  .src  .foot */\n:root{--bg:#f6f7f3;--surface: pare{width:100%;border-collapse:collapse;font-size:.95rem}\ntable.compare th{text-align:left;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600;opacity:.8;padding:6px 12px 6px 0}\ntable.compare td{padding:10px 12px 10px 0;border-top:1px solid rgba(255,255,255,.22);vertical-align:top}\n.card table.compare td{border-top:1px solid var(--line)}\n.was{opacity:.78}\n.now{font-weight:600}\n.src{font-size:.8rem;color:var(--muted);white-space:nowrap}\n.strip .src{color:#cfe0d4}\n.quote{border-left:3px solid var(--accent);padding:.15rem 0 .15rem .8rem;margin:.5rem 0}\n.foot{margin-top:28px;font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}\n@media print{body{background:#fff}.card{break-inside:avoid}}\n<\/style>\n<\/head>\n<body>\n<div class=\"page\">\n\n<div class=\"eyebrow\">J2i \u00b7 Targets \u00b7 2026-10-12 \u00b7 DRAFT, needs a named reviewer<\/div>\n<h1>Who to call first<\/h1>\n<p class=\"lede\">Fifteen real services firms with contracts ending soon, and seven inbound leads, scored on J2i's four checks: budget, authority, AI readiness and clarity, each 0 or 1. Inbound leads are <span class=\"tag warn\">fictional<\/span> and are not eligible for the top five.<\/p>\n<div class=\"strip\">\n  <div class=\"eyebrow\">Read this first<\/div>\n  <h2>Public data cannot score most of the four checks<\/h2>\n  <p>Budget, AI readiness and clarity cannot be scored for any real firm from public data, so every real firm scores 0 on them and none can reach 3, the Qualified line. Authority scores 1 only for DecisionPoint, where a COO title was found; for the other real firms no signer title was found or no lookup was run. The top five below are therefore ordered by total, then by how much Apollo and Clay evidence exists, then by earliest contract end date (ASSUMPTION: my tie-break, not J2i's). Firms with no evidence cannot rank, which says nothing against them.<\/p>\n  <p class=\"src\">Authority is scored 1 when the contact is a COO, CEO or founder (ASSUMPTION). Sources: <a href=\"data/apollo_clay_results_2026-10-12.md\">Apollo and Clay results<\/a> \u00b7 <a href=\"contracts-ending.html\">contracts ending<\/a> \u00b7 <a href=\"inbox.html\">inbox decisions<\/a>.<\/p>\n<\/div>\n\n<h2>The five best real companies to call first<\/h2>\n<div class=\"grid\">\n  <div class=\"card\">\n    <div class=\"card-head\"><h2>1. DecisionPoint Corporation<\/h2><span class=\"tag\">1 of 4<\/span><\/div>\n    <p>First of 5 ends 2026-12-29; titles for capture manager, senior proposal manager, COO and VP of business development exist there, and it announced a $25.2M prime win on 16 Apr 2026.<\/p>\n    <p>Authority 1: a COO title was returned (title only, not a direct line; ASSUMPTION that a COO signs spend).<\/p>\n    <p class=\"src\"><a href=\"https://www.usaspending.gov/award/CONT_AWD_70RCSJ25FR0000045_7001_47QTCH18D0013_4732\">USAspending award<\/a> \u00b7 <a href=\"https://decisionpointcorp.com/press-releases/\">press release<\/a> \u00b7 <a href=\"data/apollo_clay_results_2026-10-12.md\">Apollo and Clay results<\/a><\/p>\n  <\/div>\n  <div class=\"card\">\n    <div class=\"card-head\"><h2>2. Stellar Innovations &amp; Solutions Inc.<\/h2><span class=\"tag\">0 of 4<\/span><\/div>\n    <p>First of 5 ends 2026-10-26 (this month); Apollo returned a Director of Business Development there.<\/p>\n    <p>Authority 0: only a Director of Business Development was returned.<\/p>\n    <p class=\"src\"><a href=\"https://www.usaspending.gov/award/CONT_AWD_SP470925F0005_9700_SP470917D0006_9700\">USAspending award<\/a> \u00b7 <a href=\"data/apollo_clay_results_2026-10-12.md\">Apollo and Clay results<\/a><\/p>\n  <\/div>\n  <div class=\"card\">\n    <div class=\"card-head\"><h2>3. Forge Group, LLC<\/h2><span class=\"tag\">0 of 4<\/span><\/div>\n    <p>First of 4 ends 2026-10-17 (this month); an SDVOSB with about 140 staff and $19.6M estimated revenue (Apollo).<\/p>\n    <p>No title or signal data pulled.<\/p>\n    <p class=\"src\"><a href=\"https://www.usaspending.gov/award/CONT_AWD_HC104723F4063_9700_47QTCA21D00D5_4732\">USAspending award<\/a> \u00b7 <a href=\"data/apollo_clay_results_2026-10-12.md\">Apollo and Clay results<\/a><\/p>\n  <\/div>\n  <div class=\"card\">\n    <div class=\"card-head\"><h2>4. Appddictionstudio LLC<\/h2><span class=\"tag\">0 of 4<\/span><\/div>\n    <p>First of 5 ends 2026-10-21 (this month); an SDVOSB with about 68 staff (Apollo).<\/p>\n    <p>No titles, jobs or news returned.<\/p>\n    <p class=\"src\"><a href=\"https://www.usaspending.gov/award/CONT_AWD_70FA3123F00000009_7022_70FA3021A00000006_7022\">USAspending award<\/a> \u00b7 <a href=\"data/apollo_clay_results_2026-10-12.md\">Apollo and Clay results<\/a><\/p>\n  <\/div>\n  <div class=\"card\">\n    <div class=\"card-head\"><h2>5. Grant Leading Technology LLC<\/h2><span class=\"tag\">0 of 4<\/span><\/div>\n    <p>No end date this month; first of 6 ends 2027-01-02. An SDVOSB with about 76 staff (Apollo).<\/p>\n    <p>No title or signal data pulled.<\/p>\n    <p class=\"src\"><a href=\"https://www.usaspending.gov/award/CONT_AWD_693KA925C00006_6920_-NONE-_-NONE-\">USAspending award<\/a> \u00b7 <a href=\"data/apollo_clay_results_2026-10-12.md\">Apollo and Clay results<\/a><\/p>\n  <\/div>\n<\/div>\n\n<h2>Full table<\/h2>\n<p><label for=\"q\">Filter: <\/label><input id=\"q\" type=\"text\" placeholder=\"type to filter rows\"> <span class=\"src\">Click a column heading to sort; click again to reverse.<\/span><\/p>\n<div class=\"card\">\n<table class=\"compare\" id=\"t\">\n<thead><tr><th>Company<\/th><th>Total<\/th><th>Budget<\/th><th>Authority<\/th><th>AI readiness<\/th><th>Clarity<\/th><th>Contracts ending<\/th><th>Earliest end<\/th><th>Cannot be scored, and why<\/th><th>Evidence<\/th><th>Why call this month<\/th><th>Sources<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Dana Whitfield, Harborline Systems Group <span class=\"tag warn\">fictional<\/span><\/td><td data-v=\"3\">3<\/td><td>0<\/td><td>1<\/td><td>1<\/td><td>1<\/td><td data-v=\"0\">-<\/td><td data-v=\"9999-99-99\">-<\/td><td>Budget: not stated in the message<\/td><td>Authority: a COO wrote to us. AI readiness: asked &#x27;Do you do anything practical here&#x27;. Clarity: task order up for recompete in the spring, proposal team of three exhausted.<\/td><td>Recompete in the spring and she has asked twice, by DM and at the booth.<\/td><td class=\"src\"><a href=\"inbound/linkedin_dms.md\">LinkedIn DMs<\/a> \u00b7 <a href=\"inbound/conference_scans.csv\">conference scans<\/a><\/td><\/tr>\n<tr><td>Operations lead, veteran-owned logistics firm <span class=\"tag warn\">fictional<\/span><\/td><td data-v=\"3\">3<\/td><td>1<\/td><td>0<\/td><td>1<\/td><td>1<\/td><td data-v=\"0\">-<\/td><td data-v=\"9999-99-99\">-<\/td><td>Authority: an operations lead; whether they sign is not stated<\/td><td>Budget: &#x27;a few thousand dollars&#x27;. AI readiness and clarity: wants weekly ops reports summarised and customer updates drafted.<\/td><td>Wants it in two weeks, so the window is short.<\/td><td class=\"src\"><a href=\"inbound/marketplace_post.md\">marketplace post<\/a><\/td><\/tr>\n<tr><td>Angela Brooks, Northpoint Mission Services <span class=\"tag warn\">fictional<\/span><\/td><td data-v=\"2\">2<\/td><td>0<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td data-v=\"0\">-<\/td><td data-v=\"9999-99-99\">-<\/td><td>Budget: not stated. Clarity: wants training but names no problem<\/td><td>Authority: the CEO (ASSUMPTION that a CEO signs spend). AI readiness: interested in training. SDVOSB, 90 staff.<\/td><td>An SDVOSB of 90 staff whose CEO asked about training, which J2i sells.<\/td><td class=\"src\"><a href=\"inbound/conference_scans.csv\">conference scans<\/a><\/td><\/tr>\n<tr><td>Laura Chen, Meridian Clinic Group <span class=\"tag warn\">fictional<\/span><\/td><td data-v=\"2\">2<\/td><td>0<\/td><td>0<\/td><td>1<\/td><td>1<\/td><td data-v=\"0\">-<\/td><td data-v=\"9999-99-99\">-<\/td><td>Budget: not stated. Authority: a Director of Operations; whether she signs is not stated<\/td><td>AI readiness and clarity: still interested in the intake triage idea.<\/td><td>No reason to call this month: she asked to pick it up in November. Reply now so it is in the diary.<\/td><td class=\"src\"><a href=\"inbound/linkedin_dms.md\">LinkedIn DMs<\/a><\/td><\/tr>\n<tr><td>DecisionPoint Corporation<\/td><td data-v=\"1\">1<\/td><td>0<\/td><td>1<\/td><td>0<\/td><td>0<\/td><td data-v=\"5\">5<\/td><td data-v=\"2026-12-29\">2026-12-29<\/td><td>Budget, AI readiness and clarity: public data and the Apollo and Clay output do not show them<\/td><td>Authority 1: a COO title was returned (title only, not a direct line; ASSUMPTION that a COO signs spend).<\/td><td>First of 5 ends 2026-12-29; titles for capture manager, senior proposal manager, COO and VP of business development exist there, and it announced a $25.2M prime win on 16 Apr 2026.<\/td><td class=\"src\"><a href=\"https://www.usaspending.gov/award/CONT_AWD_70RCSJ25FR0000045_7001_47QTCH18D0013_4732\">USAspending award<\/a> \u00b7 <a href=\"https://decisionpointcorp.com/press-releases/\">press release<\/a> \u00b7 <a href=\"data/apollo_clay_results_2026-10-12.md\">Apollo and Clay results<\/a><\/td><\/tr>\n<tr><td>James Okafor, Bluefield Federal Partners <span class=\"tag warn\">fictional<\/span><\/td><td data-v=\"1\">1<\/td><td>0<\/td><td>0<\/td><td>1<\/td><td>0<\/td><td data-v=\"0\">-<\/td><td data-v=\"9999-99-99\">-<\/td><td>Budget: not stated. Authority: a Capture Manager is a user, not a signer (ASSUMPTION). Clarity: names a deadline, not a problem<\/td><td>AI readiness: wants a demo. Recompete in Q1.<\/td><td>Recompete in Q1 and he asked for a demo. Ownership and size are not stated, so check them first.<\/td><td class=\"src\"><a href=\"inbound/conference_scans.csv\">conference scans<\/a><\/td><\/tr>\n<tr><td>Tom Kessler, Kessler Tactical Logistics <span class=\"tag warn\">fictional<\/span><\/td><td data-v=\"1\">1<\/td><td>0<\/td><td>1<\/td><td>0<\/td><td>0<\/td><td dat <\/h2>\n  <p>Each claim was drafted, then compared with its source: the Apollo and Clay file, the inbound files, the USAspending award record, or J2i's context file. A claim stays only if its source says it.<\/p>\n<\/div>\n<div class=\"card\">\n<table class=\"compare\">\n<tr><th>Removed claim<\/th><th>Why it was removed<\/th><\/tr>\n<tr><td>Harborline&#x27;s recompete is in spring 2027<\/td><td>the message says &#x27;in the spring&#x27; with no year<\/td><\/tr>\n<tr><td>Bluefield is veteran-owned<\/td><td>nothing in the inbound files says Bluefield&#x27;s ownership<\/td><\/tr>\n<tr><td>Meridian is the healthcare clinic prospect from earlier this year<\/td><td>j2i_context.md names no such clinic<\/td><\/tr>\n<tr><td>The ending contracts will be recompeted<\/td><td>USAspending gives an End Date; it does not say the contract will be recompeted<\/td><\/tr>\n<tr><td>DecisionPoint is building capture and proposal capacity<\/td><td>none of its 10 open posts is in capture, proposal or business development<\/td><\/tr>\n<tr><td>DecisionPoint&#x27;s $25.2M win means it has budget for outside help<\/td><td>the press release reports a contract win, not a budget for outside help<\/td><\/tr>\n<tr><td>Stellar has no capture or proposal staff<\/td><td>Apollo says no such title was returned, which does not show there are none<\/td><\/tr>\n<tr><td>Appddiction Studio has no business development team<\/td><td>Apollo returned no matching titles, which does not show there is no team<\/td><\/tr>\n<tr><td>Stellar&#x27;s revenue is $19.3M<\/td><td>Apollo&#x27;s revenue field says &#x27;not given&#x27;; $19.3M comes from the description text<\/td><\/tr>\n<\/table>\n<\/div>\n\n<div class=\"foot\">Fictional leads come from the demo files in inbound/. Real-company scores use Apollo and Clay output from 12 Oct 2026 (titles only; no names or contacts were recorded) and USAspending data for the 2,000 largest awards. USAspending award links were confirmed against the API; the web page addresses were not opened. Draft until a named person reviews it.<\/div>\n\n<\/div>\n<script>\n(function () {\n  var t = document.getElementById('t'), body = t.tBodies[0], heads = t.tHead.rows[0].cells, dir = [];\n  function val(r, i) { var c = r.cells[i]; return c.getAttribute('data-v') !== null ? c.getAttribute('data-v') : c.textContent.trim(); }\n  Array.prototype.forEach.call(heads, function (h, i) {\n    h.addEventListener('click', function () {\n      dir[i] = !dir[i];\n      var rows = Array.prototype.slice.call(body.rows);\n      rows.sort(function (a, b) {\n        var x = val(a, i), y = val(b, i), nx = parseFloat(x), ny = parseFloat(y);\n        var c = (!isNaN(nx) && !isNaN(ny) && /^-?[0-9.]+$/.test(x) && /^-?[0-9.]+$/.test(y)) ? nx - ny : x.localeCompare(y);\n        return dir[i] ? c : -c;\n      });\n      rows.forEach(function (r) { body.appendChild(r); });\n    });\n  });\n  document.getElementById('q').addEventListener('input', function () {\n    var q = this.value.toLowerCase();\n    Array.prototype.forEach.call(body.rows, function (r) { r.hidden = r.textContent.toLowerCase().indexOf(q) < 0; });\n  });\n})();\n<\/script>\n<\/body>\n<\/html>\n", "opportunity-map": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>AI Opportunity Map \u00b7 Harborline Systems Group (fictional)<\/title>\n\n<style>\n/* J2i demo house style. Copy this whole file into a style block in each page.\n   Building blocks: .page  .eyebrow  h1  .lede  .strip  .grid  .card  .tag  .was/.now  table.compare  .src  .foot */\n:root{--bg:#f6f7f3;--surface:#fff;--ink:#17231d;--muted:#5f6d63;--line:#dfe5db;--accent:#2a4d3c;--soft:#e8f0e1;--warn:#9a4a1c;--warn-bg:#fbeee4;--ok:#2f6b47;--ok-bg:#e3f1e6}\n*{box-sizing:border-box}\nhtml{font-size:17px}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif;line-height:1.5}\n.page{m
