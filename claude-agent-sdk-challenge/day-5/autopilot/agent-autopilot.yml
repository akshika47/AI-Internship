# Put your agent on autopilot: copy this file into YOUR repo as .github/workflows/agent-autopilot.yml
# Then: repo Settings → Secrets and variables → Actions → New repository secret → ANTHROPIC_API_KEY.
# It runs on the schedule below and whenever you press "Run workflow" in the Actions tab.
# Every run costs money: keep max_turns and max_budget_usd in your agent, and the timeout below.
#
# Change the four lines marked CHANGE ME.
name: Agent autopilot

on:
  schedule:
    - cron: "0 7 * * 1"   # CHANGE ME: when to run (UTC). This is Mondays 07:00. Help: https://crontab.guru
  workflow_dispatch:

permissions:
  contents: read
  issues: write           # lets it open an issue with the result

concurrency:
  group: agent-autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .   # CHANGE ME: the folder your agent lives in
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # TypeScript instead? Swap these two steps for actions/setup-node@v4 and "npm ci".
      - name: Install
        run: uv sync
      - name: Run the agent
        # CHANGE ME: your run command. Anything it prints to result.md becomes the issue.
        run: uv run my_agent.py examples/sample.md > result.md
      - name: Open an issue with the result
        env:
          GH_TOKEN: ${{ github.token }}
        # CHANGE ME: the issue title
        run: gh issue create --title "Agent result · $(date -u +'%-d %b %Y')" --body-file result.md
