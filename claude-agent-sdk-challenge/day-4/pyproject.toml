[project]
name = "job-fit-agent-day-4"
version = "0.1.0"
description = "Day 4 of the Claude Agent SDK challenge: verify the agent instead of trusting it"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk==0.2.168",
    "pypdf==5.4.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]   # so tests can import agent/ and tools/
testpaths = ["tests"]
