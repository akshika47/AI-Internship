<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Returns chart</title>
    <style>
      /* Every colour and size reads the HOST's CSS variable first (so the view matches Claude or ChatGPT),
         and falls back to our own value when a host doesn't send one. */
      :root {
        color-scheme: light dark;
        --bg: var(--color-background-primary, light-dark(#ffffff, #1a1a1a));
        --panel: var(--color-background-secondary, light-dark(#f5f5f4, #262626));
        --text: var(--color-text-primary, light-dark(#1c1917, #f5f5f4));
        --muted: var(--color-text-secondary, light-dark(#57534e, #a8a29e));
        --line: var(--color-border-primary, light-dark(#e7e5e4, #404040));
        --bar: var(--color-text-tertiary, light-dark(#a8a29e, #78716c));
        --hot: var(--color-text-danger, light-dark(#b91c1c, #f87171));
        --ring: var(--color-ring-primary, light-dark(#2563eb, #60a5fa));
        --radius: var(--border-radius-md, 8px);
        --font: var(--font-sans, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
      main { padding: 16px; max-width: 720px; }
      .eyebrow { margin: 0; color: var(--muted); font-size: 13px; }
      h1 { margin: 4px 0 2px; font-size: 22px; line-height: 1.2; font-weight: 600; }
      .lede { margin: 0 0 16px; color: var(--muted); font-size: 15px; }

      /* One row per product: name and numbers on top, the bar underneath. Same layout narrow or wide. */
      #bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
      .row {
        width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline;
        padding: 8px 10px; border: 1px solid transparent; border-radius: var(--radius);
        background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
      }
      .row:hover { background: var(--panel); }
      .row[aria-pressed="true"] { border-color: var(--line); background: var(--panel); }
      .row:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
      .name { font-size: 15px; overflow-wrap: anywhere; }
      .count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
      .track { grid-column: 1 / -1; height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
      .fill { display: block; height: 100%; border-radius: 5px; background: var(--bar); min-width: 2px; }
      .top .fill { background: var(--hot); }
      .top .count { color: var(--hot); font-weight: 600; }

      #detail { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
      button.action {
        font: inherit; font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: var(--radius);
        border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer;
      }
      button.action:hover { border-color: var(--muted); }
      button.action:disabled { opacity: 0.6; cursor: progress; }
      #reasons { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
      #reasons li { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; }
      #reasons b { font-variant-numeric: tabular-nums; }
      .note { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
      .error { color: var(--hot); }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow" id="eyebrow">Returns chart</p>
      <h1 id="title">Waiting for data…</h1>
      <p class="lede" id="lede">Call the returns_chart tool and the chart appears here.</p>
      <ol id="bars"></ol>
      <section id="detail" hidden>
        <button class="action" id="reasons-btn" type="button">Show the reasons</button>
        <ul id="reasons"></ul>
        <p class="note" id="note"></p>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
