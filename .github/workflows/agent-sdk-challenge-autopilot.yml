# Day 5 of the Agent SDK challenge: the job-fit agent on autopilot.
# Every Monday it shortlists this week's job ads against a sample CV and opens an issue with the ranking.
# It calls Claude, so it costs money (19 cents for the three sample jobs in our test) and needs ANTHROPIC_API_KEY as a
# repository secret. Without the secret it does nothing and says so. You can also start it by hand from the
# Actions tab with "Run workflow".
name: Agent SDK challenge · autopilot

on:
  schedule:
    - cron: "0 7 * * 1"   # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write           # to open the shortlist issue

concurrency:
  group: agent-autopilot  # never two runs at once
  cancel-in-progress: false

jobs:
  shortlist:
    name: Weekly job shortlist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: claude-agent-sdk-challenge/day-4
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Stop here if there is no API key
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No ANTHROPIC_API_KEY secret, so the agent did not run." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ready == 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.key.outputs.ready == 'true'
      - name: Install (from the lockfile, exactly)
        if: steps.key.outputs.ready == 'true'
        run: uv sync --locked
      - name: Run the agent over this week's jobs
        if: steps.key.outputs.ready == 'true'
        run: uv run shortlist.py examples/jobs/this-week.txt examples/cvs/ops-coordinator.md
      - name: Open an issue with the shortlist
        if: steps.key.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat shortlist.md
            echo
            echo "_Run by the [autopilot workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) on a sample CV. The full reports are attached to that run._"
          } > issue.md
          gh issue create --title "Job shortlist · week of $(date -u +'%-d %b %Y')" --body-file issue.md
      - name: Keep the full reports
        if: always() && steps.key.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: job-fit-reports
          path: |
            claude-agent-sdk-challenge/day-4/shortlist.md
            claude-agent-sdk-challenge/day-4/job-fit-*.md
            claude-agent-sdk-challenge/day-4/applications.csv
          if-no-files-found: ignore
