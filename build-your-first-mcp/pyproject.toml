[project]
name = "shop-data"
version = "1.0.0"
description = "MCP server for Northwind Home, a fictional homeware store: sales, top products and return rates from SQLite."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp==4.1.0",
]

[project.scripts]
shop-data = "shop_data.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shop_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
